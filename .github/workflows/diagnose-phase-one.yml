name: Diagnose Phase One
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-phase-one.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read phase job and queue diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          async function api(path,body){const r=await fetch(base+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});const d=await r.json();if(!r.ok||!d.success)throw Error(JSON.stringify({status:r.status,errors:d.errors}));return d.result;}
          async function query(sql,params=[]){return api('/d1/database/736f655b-889d-4fb2-8948-0a396d39436f/query',{sql,params});}
          for(const [name,sql] of [
            ['intake','SELECT id,status,staged_file_id,error,updated_at FROM phase_intake_jobs'],
            ['phase_one_jobs','SELECT id,source_file_id,status,created_at,updated_at,error FROM phase_one_jobs'],
            ['phase_one_items','SELECT status,COUNT(*) count,MAX(updated_at) latest FROM phase_one_items GROUP BY status'],
            ['tracking','SELECT * FROM project_phase_tracking WHERE submission_id=\'bask-bradenton-2513-v1\''],
            ['recent_events','SELECT * FROM project_phase_tracking_events ORDER BY id DESC LIMIT 20']
          ]) console.log(name,JSON.stringify(await query(sql)));
          const qs=await api('/queues');for(const q of qs.filter(q=>q.queue_name.includes('department'))){console.log('queue',JSON.stringify(q));try{console.log('consumers',JSON.stringify(await api('/queues/'+q.queue_id+'/consumers')));}catch(e){console.log('consumer read',e.message);}}
          JS
      - name: Capture worker exception during scheduler wakeup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import {spawn} from 'node:child_process';
          const child=spawn('npx',['--yes','wrangler@4.92.0','tail','mason-forge-cloud','--format','json'],{stdio:['ignore','pipe','pipe'],env:process.env});
          child.stdout.pipe(process.stdout);child.stderr.pipe(process.stderr);
          const timer=setInterval(async()=>{try{await fetch('https://mason-forge-cloud.mason-forge-ssx.workers.dev/health',{signal:AbortSignal.timeout(15000)});}catch{}},8000);
          await new Promise(r=>setTimeout(r,55000));clearInterval(timer);child.kill('SIGTERM');
          JS
