name: Approve Bradenton Measurable Regions
on:
  workflow_run:
    workflows: ['Deploy Mason Forge Cloud']
    types: [completed]
permissions:
  contents: read
jobs:
  approve:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record Dale's mixed-sheet region approval
        env:
          MASON_API_TOKEN: ${{ secrets.MASON_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const submission='intake-2514';
          const jobs=['plan-layers-3000','plan-layers-3002','plan-layers-3012'];
          for(const id of jobs){
            const response=await fetch(`https://mason-forge-cloud.mason-forge-ssx.workers.dev/api/project-phases/${submission}/layers/${id}/regions`,{
              method:'POST',
              headers:{authorization:`Bearer ${process.env.MASON_API_TOKEN}`,'content-type':'application/json'},
              body:JSON.stringify({
                regionsReviewed:true,
                reviewer:'Dale Farrow',
                evidence:'Dale approved the identified measurable and reference regions on 2026-09-05 before measuring-layer preparation.'
              }),
              signal:AbortSignal.timeout(30000)
            });
            const result=await response.json().catch(()=>({}));
            if(!response.ok&&response.status!==409)throw Error(`${id}: ${response.status} ${JSON.stringify(result)}`);
            console.log(JSON.stringify({id,httpStatus:response.status,result}));
          }
          JS
