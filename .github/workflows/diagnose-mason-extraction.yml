name: Diagnose Mason Forge Extraction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "cloud/**"
      - ".github/workflows/diagnose-mason-extraction.yml"

permissions:
  contents: write

concurrency:
  group: mason-forge-extraction-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for live deployments
        run: sleep 45

      - name: Collect extraction diagnostics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const proxy = 'https://mason-forge-live.vercel.app/api/mason';
          const errors = [];
          const fetchJson = async (url) => {
            try {
            const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}_diagnostic=${Date.now()}-${Math.random()}`, {
              cache: 'no-store',
              signal: AbortSignal.timeout(30000),
              headers: { 'cache-control': 'no-store, no-cache, max-age=0', pragma: 'no-cache' },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${url} HTTP ${response.status}: ${text.slice(0, 2000)}`);
            return JSON.parse(text);
            } catch (error) {
              errors.push({ url, error: String(error.message) });
              return {};
            }
          };
          const viaProxy = (path) => `${proxy}?path=${encodeURIComponent(path)}`;
          const extension = (name = '') => name.includes('.') ? name.toLowerCase().split('.').pop() : '(none)';
          const report = {
            capturedAt: new Date().toISOString(),
            sourceCommit: process.env.GITHUB_SHA,
            health: await fetchJson('https://mason-forge-cloud.mason-forge-ssx.workers.dev/health'),
            bootstrap: await fetchJson(proxy),
            projects: {},
          };
          const files = [];
          for (const projectId of [4, 5]) {
            const [fileData, taskData, outputData, evidenceData] = await Promise.all([
              fetchJson(viaProxy(`api/projects/${projectId}/files`)),
              fetchJson(viaProxy(`api/projects/${projectId}/tasks`)),
              fetchJson(viaProxy(`api/projects/${projectId}/outputs`)),
              fetchJson(viaProxy(`api/projects/${projectId}/evidence`)),
            ]);
            for (const file of fileData.files || []) files.push({ projectId, ...file });
            const taskCounts = {};
            for (const task of taskData.tasks || []) taskCounts[task.status || 'UNKNOWN'] = (taskCounts[task.status || 'UNKNOWN'] || 0) + 1;
            report.projects[projectId] = {
              fileCount: (fileData.files || []).length,
              taskCount: (taskData.tasks || []).length,
              taskCounts,
              outputCount: (outputData.outputs || []).length,
              evidenceBatchCount: (evidenceData.batches || []).length,
              routedFileCount: (evidenceData.files || []).filter((file) => file.batch_id).length,
            };
          }
          const byStatus = {};
          const failedReasons = {};
          const failedExtensions = {};
          const failedSamples = [];
          for (const file of files) {
            const status = String(file.review_status || 'UNKNOWN');
            byStatus[status] = (byStatus[status] || 0) + 1;
            if (status.startsWith('EXTRACTION FAILED:')) {
              const reason = status.slice('EXTRACTION FAILED:'.length).trim();
              failedReasons[reason] = (failedReasons[reason] || 0) + 1;
              const ext = extension(file.file_name);
              failedExtensions[ext] = (failedExtensions[ext] || 0) + 1;
              if (failedSamples.length < 30) failedSamples.push({ projectId: file.project_id, fileId: file.id, extension: ext, sizeBytes: Number(file.size_bytes || 0), reason });
            }
          }
          report.errors = errors;
          report.collectionComplete = errors.length === 0;
          report.totalFiles = errors.length ? null : files.length;
          report.byStatus = byStatus;
          report.failedCount = Object.values(failedReasons).reduce((a, b) => a + b, 0);
          report.failedReasons = failedReasons;
          report.failedExtensions = failedExtensions;
          report.failedSamples = failedSamples;
          const projectValues = Object.values(report.projects);
          report.pipelineEvidence = {
            extractedCount: Number(byStatus['EXTRACTED - NEEDS HUMAN REVIEW'] || 0),
            totalTaskCount: projectValues.reduce((sum, project) => sum + Number(project.taskCount || 0), 0),
            totalOutputCount: projectValues.reduce((sum, project) => sum + Number(project.outputCount || 0), 0),
            evidenceBatchCount: projectValues.reduce((sum, project) => sum + Number(project.evidenceBatchCount || 0), 0),
            evidenceTasksCreated: projectValues.some((project) => Number(project.taskCount || 0) > 5),
            evidenceOutputsCreated: projectValues.some((project) => Number(project.outputCount || 0) > 5),
            noExtractionFailures: errors.length === 0 && Object.keys(failedReasons).length === 0,
          };
          await fs.mkdir('verification', { recursive: true });
          await fs.writeFile('verification/extraction-diagnostics.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (errors.length) process.exitCode = 1;
          NODE

      - name: Publish extraction diagnostics
        if: always()
        run: |
          test -f verification/extraction-diagnostics.json || exit 1
          report_path="${RUNNER_TEMP}/mason-extraction-diagnostics.json"
          report_worktree="${RUNNER_TEMP}/mason-extraction-diagnostics"
          cp verification/extraction-diagnostics.json "${report_path}"
          git fetch origin extraction-diagnostics
          git worktree add --detach "${report_worktree}" origin/extraction-diagnostics
          mkdir -p "${report_worktree}/verification"
          cp "${report_path}" "${report_worktree}/verification/extraction-diagnostics.json"
          git -C "${report_worktree}" config user.name "Mason Forge Diagnostics"
          git -C "${report_worktree}" config user.email "actions@users.noreply.github.com"
          git -C "${report_worktree}" add verification/extraction-diagnostics.json
          if ! git -C "${report_worktree}" diff --cached --quiet; then
            git -C "${report_worktree}" commit -m "Record Mason Forge extraction diagnostics for ${GITHUB_SHA}"
            git -C "${report_worktree}" push origin HEAD:extraction-diagnostics
          fi

# Fresh capture requested after deterministic schema and file_id-only repairs.
