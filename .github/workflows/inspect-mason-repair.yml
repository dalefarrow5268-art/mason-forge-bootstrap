name: Inspect Mason Cloud repair access
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-mason-repair.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check existing access without exposing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MASON_API_TOKEN: ${{ secrets.MASON_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','MASON_API_TOKEN','VERCEL_TOKEN']) {
            console.log(name + ' configured: ' + Boolean(process.env[name]));
          }
          const root = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID;
          async function get(path) {
            const response = await fetch(root + path, {headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(30000)});
            const data = await response.json();
            console.log('Cloudflare request status:',response.status,'success:',data.success);
            return data;
          }
          const secrets = await get('/workers/scripts/mason-forge-cloud/secrets');
          console.log('Worker credential configured:', (secrets.result || []).some(x=>x.name==='MASON_API_TOKEN'));
          const objects = await get('/r2/buckets/mason-forge-project-files/objects?prefix=projects%2F2%2F&per_page=1000');
          console.log('Object response fields:',Object.keys(objects.result || {}));
          const rows = Array.isArray(objects.result) ? objects.result : objects.result?.objects || [];
          console.log('Project 2 object count:',rows.length);
          const names = ['README.md','Master_Contact_System_2026-07-27_update-08_merge_ready.md','walmart_lucernex_july13_15_rfi_ccd_closeout_batch_intelligence_2026-07-29.md'];
          console.log('Matching recovery candidates:',JSON.stringify(rows.filter(x=>names.some(n=>String(x.key || x.name).endsWith(n))).map(x=>({key:x.key || x.name,size:x.size}))));
          if(process.env.MASON_API_TOKEN){
            const response = await fetch('https://mason-forge-cloud.mason-forge-ssx.workers.dev/api/connector/bootstrap',{headers:{authorization:'Bearer '+process.env.MASON_API_TOKEN},signal:AbortSignal.timeout(30000)});
            console.log('Stored application credential HTTP status:',response.status);
          }
          NODE
