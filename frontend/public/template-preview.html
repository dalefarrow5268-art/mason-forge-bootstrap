<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mason Forge Template Preview</title>
  <style>
    :root{--cyan:#00b9ff;--blue:#145dff;--gold:#ffd900;--orange:#ff6a00;--green:#00e56f;--panel:#02070d;--line:rgba(0,185,255,.38)}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#eef9ff;font-family:"Arial Narrow","Segoe UI",Arial,sans-serif}
    body{background:
      radial-gradient(circle at 88% 10%,rgba(0,109,255,.11),transparent 32%),
      radial-gradient(circle at 10% 84%,rgba(0,80,255,.09),transparent 30%),
      linear-gradient(180deg,#010305 0%,#000 100%)}
    .stage{position:relative;width:100vw;height:100vh;min-width:1280px;min-height:720px;overflow:hidden}
    .stage:before{content:"";position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(0,140,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(0,140,255,.10) 1px,transparent 1px);background-size:58px 58px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 72%)}
    .stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.48) 100%)}
    .weather{position:absolute;z-index:3;top:2.2vh;right:2vw;width:min(57vw,1120px);height:132px;border:1px solid rgba(0,185,255,.55);clip-path:polygon(2.2% 0,98% 0,100% 24%,100% 78%,97.2% 100%,2% 100%,0 76%,0 22%);background:linear-gradient(180deg,rgba(3,17,29,.96),rgba(0,5,11,.94));box-shadow:0 0 0 1px rgba(0,70,140,.35) inset,0 0 34px rgba(0,117,255,.16);display:grid;grid-template-columns:170px 1.15fr 1fr 1.25fr 1.1fr;padding:8px 14px;gap:0}
    .weather:before,.weather:after{content:"";position:absolute;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.7}.weather:before{left:6%;right:55%;top:5px}.weather:after{left:52%;right:4%;bottom:5px}
    .cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;border-right:1px solid rgba(0,185,255,.25)}.cell:last-child{border:0}
    .label{position:absolute;top:3px;left:16px;color:#00d5ff;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
    .globe-wrap{overflow:hidden}.globe{position:relative;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#13caff 0 2%,#0476ae 18%,#002b52 54%,#00111f 72%);border:1px solid #00bfff;box-shadow:0 0 22px rgba(0,190,255,.62),inset -12px -9px 22px rgba(0,0,0,.78)}
    .globe:before{content:"";position:absolute;inset:-1px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,transparent 0 12px,rgba(0,210,255,.22) 13px 14px),repeating-linear-gradient(90deg,transparent 0 16px,rgba(0,210,255,.18) 17px 18px);mix-blend-mode:screen;animation:spin 12s linear infinite}
    .globe:after{content:"";position:absolute;inset:-12px;border:1px dashed rgba(0,180,255,.45);border-radius:50%;animation:spin 18s linear reverse infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .weather-main{display:flex;align-items:center;gap:17px;padding-top:10px}.sun{position:relative;width:42px;height:42px;border:3px solid var(--gold);border-radius:50%;filter:drop-shadow(0 0 8px rgba(255,218,0,.35))}.sun i{position:absolute;left:50%;top:50%;width:2px;height:60px;background:linear-gradient(transparent 0 8px,var(--gold) 9px 14px,transparent 15px);transform-origin:center}.sun i:nth-child(2){transform:translate(-50%,-50%) rotate(45deg)}.sun i:nth-child(3){transform:translate(-50%,-50%) rotate(90deg)}.sun i:nth-child(4){transform:translate(-50%,-50%) rotate(135deg)}.sun i:first-child{transform:translate(-50%,-50%)}
    .temp{font-size:39px;font-weight:300;letter-spacing:.03em;line-height:1;color:#f5fbff;text-shadow:0 0 12px rgba(255,255,255,.2)}.sub{font-size:11px;color:#b8c8d5;letter-spacing:.12em;margin-top:7px}.micro{position:absolute;bottom:8px;left:14px;color:#00bfff;font-size:9px;letter-spacing:.07em;white-space:nowrap}
    .clock,.date{padding-top:12px;text-align:center}.time{font-family:Consolas,"Courier New",monospace;font-size:39px;letter-spacing:.04em;font-weight:300}.ampm{font-size:13px;margin-left:6px;color:#dceeff}.zone{font-size:10px;color:#8fa9bd;margin-top:4px}.date strong{display:block;color:#ffdf00;font-size:17px;letter-spacing:.035em;white-space:nowrap}.coords{position:absolute;bottom:8px;color:#007fbe;font-size:9px;white-space:nowrap}
    .status{flex-direction:column;gap:7px}.welcome{color:#00bfff;font-size:12px;letter-spacing:.04em}.chip{display:flex;align-items:center;gap:9px;padding:9px 15px;border:1px solid rgba(0,229,111,.75);border-radius:6px;color:#eafff2;font-size:13px;letter-spacing:.08em;box-shadow:0 0 14px rgba(0,229,111,.10) inset}.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}.ok{font-size:10px;color:#00bfff;letter-spacing:.1em}
    .scout-card{position:absolute;z-index:3;left:1.5vw;bottom:2.2vh;width:300px;height:500px;border:1px solid rgba(0,185,255,.55);border-radius:8px;background:linear-gradient(180deg,rgba(2,9,16,.96),rgba(0,3,8,.98));box-shadow:0 0 30px rgba(0,99,255,.13),inset 0 0 30px rgba(0,55,110,.08);overflow:hidden}
    .scout-head{position:absolute;left:16px;top:12px}.scout-title{font-size:19px;letter-spacing:.08em}.scout-sub{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:.02em}.icons{position:absolute;right:12px;top:14px;color:#8ca5b5;font-size:15px;letter-spacing:9px}
    .portrait{position:absolute;left:0;right:0;top:61px;height:370px}.portrait:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,rgba(0,113,255,.18),transparent 43%)}
    .head{position:absolute;left:72px;top:6px;width:158px;height:212px;border-radius:48% 48% 45% 45%/42% 42% 56% 56%;background:radial-gradient(circle at 50% 35%,rgba(20,90,255,.92),rgba(0,18,72,.98) 56%,#020713 74%);border:1px solid #087dff;box-shadow:0 0 22px rgba(0,100,255,.55),inset 0 0 35px rgba(0,180,255,.25);overflow:hidden}
    .head:before,.torso:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(0,190,255,.95) 0 1px,transparent 1.5px),linear-gradient(90deg,transparent 49.7%,rgba(0,140,255,.7) 50%,transparent 50.3%);background-size:7px 7px,100% 100%;opacity:.77}.head:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(88deg,transparent 0 10px,rgba(255,65,20,.16) 11px,transparent 12px),repeating-linear-gradient(1deg,transparent 0 16px,rgba(0,170,255,.2) 17px,transparent 18px);mix-blend-mode:screen}
    .eyes{position:absolute;top:91px;left:22px;right:22px;display:flex;justify-content:space-between;z-index:2}.eye{width:49px;height:26px;border:2px solid #059cff;border-radius:60% 45%;background:radial-gradient(circle,#07101f 0 10%,#64cfff 12% 25%,#0b58b5 26% 40%,#02040a 42%);box-shadow:0 0 13px rgba(0,160,255,.8)}.nose{position:absolute;z-index:2;left:75px;top:112px;width:10px;height:43px;border-left:1px solid #18baff;border-bottom:1px solid #18baff;transform:skewX(-8deg);filter:drop-shadow(0 0 5px #008cff)}.mouth{position:absolute;z-index:2;left:52px;top:167px;width:56px;height:13px;border-bottom:2px solid #0db7ff;border-radius:50%;box-shadow:0 4px 8px rgba(0,115,255,.6)}
    .neck{position:absolute;left:112px;top:199px;width:78px;height:92px;background:linear-gradient(90deg,#020719,#0737a0,#020719);border-left:1px solid #087dff;border-right:1px solid #087dff}.torso{position:absolute;left:27px;top:270px;width:246px;height:118px;border-radius:50% 50% 0 0/75% 75% 0 0;background:radial-gradient(circle at 50% 0,#073fba,#010714 63%);border-top:1px solid #087dff;overflow:hidden}.torso:after{content:"";position:absolute;left:50%;top:-7px;width:5px;height:125px;background:#0b55ff;box-shadow:0 0 14px #0b8dff}
    .input{position:absolute;left:14px;right:14px;bottom:14px;height:54px;border:1px solid rgba(0,185,255,.45);border-radius:7px;color:#6f8190;display:flex;align-items:center;padding:0 15px;font-size:15px}.mic{margin-left:auto;color:#cbd8df;font-size:21px}
    .hint{position:absolute;z-index:2;right:3vw;bottom:3vh;color:rgba(0,185,255,.28);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
    @media (max-height:850px){.weather{height:112px}.scout-card{height:430px;width:258px}.portrait{transform:scale(.86);transform-origin:top left;width:300px}.input{height:48px}.scout-card .input{bottom:10px}}
    @media (min-width:2300px){.weather{height:146px;width:1160px}.scout-card{width:340px;height:566px;transform-origin:left bottom}.portrait{left:20px;transform:scale(1.12);transform-origin:top left}.input{height:62px}}
  </style>
</head>
<body>
  <main class="stage" aria-label="Mason Forge universal page template preview">
    <section class="weather" aria-label="Weather date and time instrument">
      <div class="cell globe-wrap"><div class="globe"></div></div>
      <div class="cell"><span class="label">Weather</span><div class="weather-main"><div class="sun"><i></i><i></i><i></i><i></i></div><div><div class="temp"><span id="temp">72</span>°F</div><div class="sub" id="condition">CLEAR SKIES</div></div></div><div class="micro">HUM 38% &nbsp;|&nbsp; WIND 6 MPH NE</div></div>
      <div class="cell clock"><span class="label">Time</span><div><span class="time" id="time">07:24</span><span class="ampm" id="ampm">AM</span><div class="zone">LOCAL</div></div><div class="coords">LIVE SYSTEM CLOCK</div></div>
      <div class="cell date"><span class="label">Date</span><strong id="date">TUE, JULY 28, 2026</strong><div class="coords">WEATHER CONTROL NODE</div></div>
      <div class="cell status"><div class="welcome">Welcome back,</div><div class="chip"><span class="dot"></span>SITE SAFE <span>✓</span></div><div class="ok">ALL SYSTEMS NORMAL</div></div>
    </section>

    <aside class="scout-card" aria-label="Scout assistant">
      <div class="scout-head"><div class="scout-title">SCOUT</div><div class="scout-sub">AI MEMBER ASSISTANT</div></div><div class="icons">⛶ ⤢</div>
      <div class="portrait"><div class="head"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="nose"></div><div class="mouth"></div></div><div class="neck"></div><div class="torso"></div></div>
      <div class="input">Ask Scout… <span class="mic">♩</span></div>
    </aside>
    <div class="hint">Universal Template · Draft 01</div>
  </main>
  <script>
    const timeEl=document.getElementById('time'),ampmEl=document.getElementById('ampm'),dateEl=document.getElementById('date');
    function tick(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;timeEl.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');ampmEl.textContent=ap;dateEl.textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase()}
    tick();setInterval(tick,1000);
  </script>
</body>
</html>
