name: Verify Bradenton Measuring Layers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-bradenton-layers.yml'
      - 'cloud/scripts/approve_layer_reviews.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install PyMuPDF==1.26.6
      - name: Verify visually reviewed source and layer bytes
        run: python scripts/approve_layer_reviews.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
