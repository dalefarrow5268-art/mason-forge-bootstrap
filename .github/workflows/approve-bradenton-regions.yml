name: Approve Bradenton Measurable Regions
on:
  workflow_run:
    workflows: ['Deploy Mason Forge Cloud']
    types: [completed]
permissions:
  contents: read
jobs:
  approve:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record Dale's mixed-sheet region approval
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const submission='intake-2514';
          const jobs=['plan-layers-3000','plan-layers-3002','plan-layers-3012'];
          const database='736f655b-889d-4fb2-8948-0a396d39436f';
          const url=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${database}/query`;
          async function query(body){
            const response=await fetch(url,{method:'POST',headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});
            const data=await response.json();
            if(!response.ok||!data.success)throw Error(`D1 ${response.status}: ${JSON.stringify(data.errors||[])}`);
            return data.result;
          }
          for(const id of jobs){
            const selected=(await query({sql:'SELECT status,route_json FROM plan_layer_jobs WHERE id=?',params:[id]}))[0]?.results?.[0];
            if(!selected)throw Error(`${id}: missing layer job`);
            if(selected.status!=='REGION_REVIEW_REQUIRED'){console.log(JSON.stringify({id,status:selected.status,skipped:true}));continue;}
            const route=JSON.parse(selected.route_json||'{}');
            if(route.route!=='MIXED'||!Array.isArray(route.regions)||!route.regions.length)throw Error(`${id}: invalid mixed-sheet route`);
            const measurable=route.regions.filter(x=>/TAKEOFF|MEASURABLE/i.test(String(x?.purpose||'')));
            if(!measurable.length)throw Error(`${id}: no routed measurable regions`);
            const review={reviewer:'Dale Farrow',evidence:'Dale approved the identified measurable and reference regions on 2026-09-05 before measuring-layer preparation.',regionsReviewed:true,measurableRegions:measurable,referenceRegions:route.regions.filter(x=>!measurable.includes(x)),at:new Date().toISOString()};
            await query({sql:'INSERT OR IGNORE INTO project_phase_audit(id,submission_id,action,target_id,detail_json,created_at) VALUES(?,?,?,?,?,?)',params:[`region-review-${id}`,submission,'VERIFY_MIXED_SHEET_REGIONS',id,JSON.stringify(review),review.at]});
            await query({sql:"UPDATE plan_layer_jobs SET status='PENDING',route_json=?,error=NULL,updated_at=? WHERE id=? AND status='REGION_REVIEW_REQUIRED'",params:[JSON.stringify({...route,regionReview:review}),review.at,id]});
            console.log(JSON.stringify({id,status:'PENDING',measurableRegions:measurable.length,referenceRegions:review.referenceRegions.length}));
          }
          JS
