name: Deploy Mason Forge Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - ".github/workflows/deploy-mason-forge-cloud.yml"

permissions:
  contents: write

concurrency:
  group: mason-forge-cloud-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate every Worker module
        run: npm run check

      - name: Read release marker
        id: release
        run: |
          RELEASE_ID=$(node -e "const fs=require('fs');const t=fs.readFileSync('wrangler.toml','utf8');const m=t.match(/^RELEASE_ID\s*=\s*\"([^\"]+)\"/m);if(!m)process.exit(1);process.stdout.write(m[1]);")
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Cloudflare deployment dry run
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Mason Forge Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live production end to end
        id: live_verify
        continue-on-error: true
        run: node scripts/verify-live.mjs
        env:
          VERIFY_REPORT_PATH: ../runtime-verification/latest.json
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.release_id }}

      - name: Publish live verification ledger
        if: always()
        working-directory: .
        run: |
          test -f runtime-verification/latest.json || {
            mkdir -p runtime-verification
            printf '%s\n' '{"success":false,"errors":["Verification report was not produced."]}' > runtime-verification/latest.json
          }
          node -e "const fs=require('fs');const p='runtime-verification/latest.json';const x=JSON.parse(fs.readFileSync(p));x.sourceCommit=process.env.GITHUB_SHA;x.workflowRunId=process.env.GITHUB_RUN_ID;fs.writeFileSync(p,JSON.stringify(x,null,2)+'\\n');"
          git config user.name "Mason Forge Verification"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B production-verification
          git add runtime-verification/latest.json
          git commit -m "Record Mason Forge production verification for ${GITHUB_SHA}" || true
          git push --force origin production-verification

      - name: Enforce production verification
        if: always() && steps.live_verify.outcome != 'success'
        working-directory: .
        run: |
          cat runtime-verification/latest.json || true
          exit 1
