name: Export Bradenton Layer Review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-layer-review.yml'
      - 'cloud/scripts/export_layer_review.py'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install PyMuPDF==1.26.6
      - name: Download source and layer packages
        run: python scripts/export_layer_review.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OUTPUT_DIR: ${{ runner.temp }}/bradenton-layer-review
      - uses: actions/upload-artifact@v4
        with:
          name: bradenton-layer-review
          path: ${{ runner.temp }}/bradenton-layer-review
          if-no-files-found: error
          retention-days: 1
