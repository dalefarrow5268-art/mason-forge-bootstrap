name: Retry Bradenton Phase Three
on:
  workflow_run:
    workflows: ["Deploy Mason Forge Cloud"]
    types: [completed]
permissions:
  contents: read
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Requeue affected Phase Three sheets after verified deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          async function query(sql,params=[]){const r=await fetch(base+'/d1/database/736f655b-889d-4fb2-8948-0a396d39436f/query',{method:'POST',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(30000)});const d=await r.json();if(!r.ok||!d.success)throw Error(JSON.stringify({status:r.status,errors:d.errors}));return d.result?.[0]||{};}
          const submission='bask-bradenton-2513-v1',time=new Date().toISOString();
          const result=await query("UPDATE phase_three_items SET status='PENDING',error=NULL,updated_at=? WHERE job_id=? AND status='NEEDS_REVIEW' AND EXISTS(SELECT 1 FROM phase_three_jobs j WHERE j.id=? AND j.status='RUNNING')",[time,submission,submission]);
          console.log('requeued',JSON.stringify({changes:result.meta?.changes||0,submission,time}));
          const counts=await query('SELECT status,COUNT(*) count FROM phase_three_items WHERE job_id=? GROUP BY status',[submission]);
          console.log('counts',JSON.stringify(counts.results||[]));
          try{await fetch('https://mason-forge-cloud.mason-forge-ssx.workers.dev/health',{signal:AbortSignal.timeout(15000)});}catch(e){console.log('health wakeup',String(e.message||e));}
          JS
