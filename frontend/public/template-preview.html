<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mason Forge Weather Instrument</title>
<style>
:root{--cyan:#00c9ff;--cyan2:#0089c9;--gold:#f5d20a;--green:#00ef79;--white:#e9f4fb}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;color:var(--white)}
.stage{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
.instrument{position:absolute;top:8px;right:11px;width:699px;height:106px;display:grid;grid-template-columns:112px 151px 128px 151px 157px;overflow:hidden;background:linear-gradient(180deg,#020b13 0%,#01060b 100%);border:1px solid rgba(0,181,255,.56);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);box-shadow:inset 0 0 0 1px rgba(0,58,96,.55),0 0 18px rgba(0,126,255,.10)}
.instrument:before,.instrument:after{content:"";position:absolute;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,210,255,.52),transparent);pointer-events:none}.instrument:before{top:7px}.instrument:after{bottom:7px}
.corner{position:absolute;width:18px;height:18px;z-index:5;pointer-events:none}.tl{left:3px;top:3px;border-left:2px solid var(--cyan);border-top:2px solid var(--cyan)}.tr{right:3px;top:3px;border-right:2px solid var(--cyan);border-top:2px solid var(--cyan)}.bl{left:3px;bottom:3px;border-left:2px solid #008fcb;border-bottom:2px solid #008fcb}.br{right:3px;bottom:3px;border-right:2px solid #008fcb;border-bottom:2px solid #008fcb}
.cell{position:relative;min-width:0;border-right:1px solid rgba(0,145,212,.28);height:100%}.cell:last-child{border-right:0}.cell:after{content:"";position:absolute;right:7px;top:12px;width:5px;height:1px;background:#007fb8;box-shadow:0 7px 0 rgba(0,127,184,.65),0 14px 0 rgba(0,127,184,.42)}
.label{position:absolute;left:12px;top:10px;color:#06ccf7;font-size:8px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;line-height:1}.label:after{content:"";display:inline-block;width:15px;height:3px;margin-left:4px;border-top:1px solid rgba(0,196,247,.5);border-right:1px solid rgba(0,196,247,.4);vertical-align:middle}
.globe-cell{display:flex;align-items:center;justify-content:center;padding-right:5px}.globe-shell{position:relative;width:82px;height:82px;border-radius:50%;filter:drop-shadow(0 0 8px rgba(0,190,255,.55))}.globe-shell:before{content:"";position:absolute;inset:-6px;border:1px dashed rgba(0,194,255,.33);border-radius:50%;transform:rotate(18deg)}.globe-shell:after{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 8%,rgba(0,202,255,.55) 9% 10%,transparent 11% 28%,rgba(0,202,255,.38) 29% 30%,transparent 31% 55%,rgba(0,202,255,.35) 56% 57%,transparent 58% 100%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.globe-core{position:absolute;inset:7px;border-radius:50%;overflow:hidden;border:1px solid rgba(0,211,255,.8);background:radial-gradient(circle at 38% 28%,#0ed6ff 0 2%,#087cb4 16%,#02426e 41%,#00172c 72%,#000912 100%);box-shadow:inset -8px -7px 15px rgba(0,0,0,.78),inset 4px 1px 10px rgba(0,214,255,.22)}.globe-core:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(ellipse at center,transparent 0 9px,rgba(0,213,255,.21) 10px 11px),repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,213,255,.17) 12px 13px);mix-blend-mode:screen}.globe-core:after{content:"";position:absolute;left:13px;top:15px;width:37px;height:35px;background:linear-gradient(145deg,rgba(0,224,255,.40),rgba(0,122,190,.10));clip-path:polygon(7% 17%,31% 5%,47% 16%,62% 12%,82% 27%,72% 44%,57% 48%,52% 65%,37% 61%,22% 78%,16% 58%,4% 45%);filter:drop-shadow(0 0 3px rgba(0,210,255,.8))}.orbit{position:absolute;inset:3px;border:1px solid rgba(0,193,255,.24);border-radius:50%;transform:rotate(-25deg) scaleY(.56)}.node{position:absolute;width:3px;height:3px;border-radius:50%;background:#ff8d12;box-shadow:0 0 5px #ff7c00}.n1{left:15px;top:20px}.n2{right:13px;top:34px}.n3{left:40px;bottom:9px}
.weather-cell{padding:0 9px}.weather-row{position:absolute;left:12px;top:30px;display:flex;align-items:center;gap:12px}.sun{position:relative;width:31px;height:31px;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 9px rgba(245,210,10,.12)}.sun:before,.sun:after,.sun i:before,.sun i:after{content:"";position:absolute;left:50%;top:50%;width:43px;height:1px;transform:translate(-50%,-50%);background:linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 37px,var(--gold) 37px 43px)}.sun:after{transform:translate(-50%,-50%) rotate(90deg)}.sun i:before{transform:translate(-50%,-50%) rotate(45deg)}.sun i:after{transform:translate(-50%,-50%) rotate(-45deg)}.temp{font-size:27px;font-weight:300;letter-spacing:.01em;color:#eaf3f8;line-height:1}.condition{position:absolute;left:62px;top:65px;font-size:8px;color:#b8c9d4;letter-spacing:.08em;white-space:nowrap}.micro{position:absolute;left:12px;bottom:10px;color:#00bdea;font-size:7px;letter-spacing:.06em;white-space:nowrap}
.time-cell{padding:0 10px}.time-row{position:absolute;left:12px;top:32px;display:flex;align-items:flex-end;gap:6px}.time-value{font-family:Consolas,"Courier New",monospace;font-size:27px;font-weight:300;letter-spacing:.02em;color:#e8f1f7;line-height:1}.ampm{font-size:8px;padding-bottom:3px;color:#eef4f8}.zone{position:absolute;left:76px;top:67px;font-size:8px;color:#ccd6dc;letter-spacing:.06em}
.date-cell{padding:0 10px}.date-value{position:absolute;left:12px;top:46px;color:#f2d20b;font-size:10px;font-weight:700;letter-spacing:.035em;white-space:nowrap}.coords{position:absolute;left:12px;bottom:10px;color:#047db0;font-size:7px;letter-spacing:.045em;white-space:nowrap}
.status-cell{display:flex;flex-direction:column;align-items:center;padding:0 11px}.welcome{margin-top:18px;color:#00c1ef;font-size:9px;letter-spacing:.02em}.safe{margin-top:8px;width:105px;height:30px;border:1px solid rgba(0,239,121,.78);border-radius:5px;background:linear-gradient(180deg,rgba(0,71,39,.23),rgba(0,24,13,.20));display:flex;align-items:center;justify-content:center;gap:7px;color:#e9fff3;font-size:9px;letter-spacing:.06em;box-shadow:inset 0 0 12px rgba(0,239,121,.07)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green),0 0 0 3px rgba(0,239,121,.10)}.check{color:#00f186;font-size:10px}.normal{margin-top:7px;color:#00bce9;font-size:7px;letter-spacing:.10em}
@media(max-width:760px){.instrument{transform:scale(calc((100vw - 20px)/699));transform-origin:top right;right:10px}}
</style>
</head>
<body>
<main class="stage">
<section class="instrument" aria-label="Weather date and time instrument">
<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
<div class="cell globe-cell"><div class="globe-shell"><div class="globe-core"></div><div class="orbit"></div><span class="node n1"></span><span class="node n2"></span><span class="node n3"></span></div></div>
<div class="cell weather-cell"><span class="label">Weather</span><div class="weather-row"><div class="sun"><i></i></div><div class="temp">72°F</div></div><div class="condition">CLEAR SKIES</div><div class="micro">HUM 38% &nbsp;|&nbsp; WIND 6 MPH NE</div></div>
<div class="cell time-cell"><span class="label">Time</span><div class="time-row"><span class="time-value" id="time">07:24</span><span class="ampm" id="ampm">AM</span></div><div class="zone">PDT</div></div>
<div class="cell date-cell"><span class="label">Date</span><div class="date-value" id="date">SUN, JULY 27, 2025</div><div class="coords">LAT 34.0322° N &nbsp;|&nbsp; LON 118.2437° W</div></div>
<div class="cell status-cell"><div class="welcome">Welcome back,</div><div class="safe"><span class="dot"></span><span>SITE SAFE</span><span class="check">✓</span></div><div class="normal">ALL SYSTEMS NORMAL</div></div>
</section>
</main>
<script>
const time=document.getElementById('time'),ampm=document.getElementById('ampm'),date=document.getElementById('date');
function update(){const d=new Date();let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;time.textContent=String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');ampm.textContent=ap;date.textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase()}
update();setInterval(update,1000);
</script>
</body>
</html>
