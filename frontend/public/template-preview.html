.scout-wave{position:absolute;left:25px;right:25px;bottom:78px;height:26px;z-index:5;display:flex;align-items:center;justify-content:center;gap:3px;pointer-events:none}.scout-wave:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,202,255,.24)}.scout-wave i{position:relative;z-index:1;width:2px;height:100%;border-radius:2px;background:#05ceff;box-shadow:0 0 5px rgba(0,207,255,.72);transform:scaleY(var(--idle));transform-origin:center;transition:transform .22s ease,opacity .22s ease;opacity:.66}.scout-panel.is-speaking .scout-wave i{opacity:1;animation:scoutVoice .62s ease-in-out infinite alternate;animation-delay:var(--delay)}@keyframes scoutVoice{0%{transform:scaleY(.16)}100%{transform:scaleY(var(--talk))}}@media(prefers-reduced-motion:reduce){.scout-panel.is-speaking .scout-wave i{animation:none;transform:scaleY(.7)}}@media(max-width:930px){.mf-brand{width:360px;left:14px;top:12px}.scout-panel{transform:scale(.72);transform-origin:bottom left;left:14px;bottom:14px}.weather{transform:scale(calc((100vw - 28px)/990));transform-origin:top right;right:14px}}

<script>const time=document.getElementById('time'),ampm=document.getElementById('ampm'),date=document.getElementById('date');function update(){const d=new Date();let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;time.textContent=String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');ampm.textContent=ap;date.textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase().replace(/,/g,'')}update();setInterval(update,1000);;const scoutPanel=document.querySelector(".scout-panel");window.ScoutVoice={start(){scoutPanel?.classList.add("is-speaking")},stop(){scoutPanel?.classList.remove("is-speaking")},speak(message){if(!("speechSynthesis" in window)||!message)return;const voice=new SpeechSynthesisUtterance(message);voice.onstart=()=>this.start();voice.onend=voice.onerror=()=>this.stop();window.speechSynthesis.cancel();window.speechSynthesis.speak(voice)}};
