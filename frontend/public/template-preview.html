<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mason Forge Weather Instrument - Readable V3</title>
<style>
:root{--cyan:#00cfff;--cyan2:#63e8ff;--gold:#f5d20a;--green:#00f47d;--white:#f2fbff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:var(--white);font-family:"Arial Narrow","Segoe UI",Arial,sans-serif}
.stage{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
.weather{position:absolute;top:12px;right:14px;width:900px;height:138px;display:grid;grid-template-columns:150px 190px 160px 205px 195px;overflow:hidden;background:linear-gradient(180deg,#020d16 0%,#01060b 100%);border:1px solid rgba(0,207,255,.68);clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);box-shadow:inset 0 0 0 1px rgba(0,69,112,.7),0 0 24px rgba(0,150,255,.14)}
.weather:before,.weather:after{content:"";position:absolute;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,224,255,.7),transparent)}.weather:before{top:9px}.weather:after{bottom:9px}
.corner{position:absolute;width:23px;height:23px;z-index:5}.tl{left:4px;top:4px;border-left:3px solid var(--cyan);border-top:3px solid var(--cyan)}.tr{right:4px;top:4px;border-right:3px solid var(--cyan);border-top:3px solid var(--cyan)}.bl{left:4px;bottom:4px;border-left:3px solid #008fcb;border-bottom:3px solid #008fcb}.br{right:4px;bottom:4px;border-right:3px solid #008fcb;border-bottom:3px solid #008fcb}
.cell{position:relative;height:100%;min-width:0;border-right:1px solid rgba(0,175,240,.34)}.cell:last-child{border-right:0}.cell:after{content:"";position:absolute;right:9px;top:15px;width:7px;height:1px;background:#009bd5;box-shadow:0 9px 0 rgba(0,155,213,.78),0 18px 0 rgba(0,155,213,.54)}
.label{position:absolute;left:16px;top:14px;color:#0bd9ff;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1;text-shadow:0 0 7px rgba(0,207,255,.4)}.label:after{content:"";display:inline-block;width:22px;height:5px;margin-left:6px;border-top:1px solid rgba(0,214,255,.7);border-right:1px solid rgba(0,214,255,.55);vertical-align:middle}
.globe-cell{display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(0,140,255,.18),transparent 66%)}
.globe-frame{position:relative;width:142px;height:126px;display:flex;align-items:center;justify-content:center}.globe-frame:before,.globe-frame:after{content:"";position:absolute;left:2px;right:2px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,218,255,.75),transparent)}.globe-frame:before{top:8px}.globe-frame:after{bottom:8px}.gb{position:absolute;width:20px;height:20px;border-color:rgba(0,218,255,.9)}.gb1{left:3px;top:10px;border-left:2px solid;border-top:2px solid}.gb2{right:3px;top:10px;border-right:2px solid;border-top:2px solid}.gb3{left:3px;bottom:10px;border-left:2px solid;border-bottom:2px solid}.gb4{right:3px;bottom:10px;border-right:2px solid;border-bottom:2px solid}.globe-frame .gb{display:none}
.earth-real{position:relative;width:104px;height:104px;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 14px rgba(0,207,255,.9),inset 0 0 16px rgba(0,211,255,.36)}.earth-real:after{content:"";position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 32% 22%,rgba(170,251,255,.24),transparent 30%),radial-gradient(ellipse at 103% 50%,rgba(0,1,10,.86),transparent 49%),linear-gradient(90deg,rgba(0,218,255,.12),transparent 35%,rgba(0,0,12,.28))}.earth-surface{position:absolute;z-index:1;left:0;top:0;width:400%;height:100%;display:flex;animation:earthPan 120s linear infinite reverse}.earth-surface img{display:block;flex:0 0 50%;width:50%;height:100%;object-fit:fill;filter:saturate(1.12) contrast(1.07) brightness(.94)}@keyframes earthPan{to{transform:translateX(-50%)}}.world{animation:worldSpin 46s linear infinite reverse}.grid{transform-origin:80px 80px;animation:gridSpin 76s linear infinite reverse}.orbit1{transform-origin:80px 80px;animation:orbit 32s linear infinite}.orbit2{transform-origin:80px 80px;animation:orbit 54s linear reverse infinite}@keyframes worldSpin{from{transform:translateX(0)}to{transform:translateX(-160px)}}@keyframes gridSpin{to{transform:rotate(360deg)}}@keyframes orbit{to{transform:rotate(360deg)}}
.sunrow{position:absolute;left:16px;top:42px;display:flex;align-items:center;gap:16px}.sun{position:relative;width:39px;height:39px;border:2px solid var(--gold);border-radius:50%;filter:drop-shadow(0 0 6px rgba(245,210,10,.35))}.sun:before,.sun:after,.sun i:before,.sun i:after{content:"";position:absolute;left:50%;top:50%;width:56px;height:2px;transform:translate(-50%,-50%);background:linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 48px,var(--gold) 48px 56px)}.sun:after{transform:translate(-50%,-50%) rotate(90deg)}.sun i:before{transform:translate(-50%,-50%) rotate(45deg)}.sun i:after{transform:translate(-50%,-50%) rotate(-45deg)}.temp{font-size:36px;font-weight:300;line-height:1;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.2)}.condition{position:absolute;left:82px;top:86px;font-size:13px;font-weight:800;color:#e8f3f8;letter-spacing:.08em;white-space:nowrap}.micro{position:absolute;left:14px;bottom:12px;color:#65e8ff;font-size:9px;font-weight:800;letter-spacing:.01em;font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;white-space:nowrap;text-shadow:0 0 10px rgba(0,207,255,.6)}
.timerow{position:absolute;left:18px;top:45px;display:flex;align-items:flex-end;gap:8px}.time{font-family:Consolas,"Courier New",monospace;font-size:38px;font-weight:300;line-height:1;color:#fff}.ampm{font-size:13px;font-weight:800;padding-bottom:5px;color:#fff}.zone{position:absolute;left:100px;top:92px;font-size:13px;font-weight:900;color:#e7f2f8;letter-spacing:.08em}
.dateval{position:absolute;left:16px;top:62px;color:var(--gold);font-size:15px;font-weight:900;letter-spacing:.035em;white-space:nowrap;text-shadow:0 0 8px rgba(245,210,10,.2)}.coords{position:absolute;left:14px;bottom:12px;color:#65e8ff;font-size:9px;font-weight:800;letter-spacing:0;font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;white-space:nowrap;text-shadow:0 0 10px rgba(0,207,255,.58)}
.status{display:flex;flex-direction:column;align-items:center}.welcome{margin-top:18px;color:#78ebff;font-size:17px;font-weight:900;letter-spacing:.02em;text-shadow:0 0 10px rgba(0,207,255,.65)}.safe{margin-top:9px;width:142px;height:40px;border:1px solid rgba(0,244,125,.9);border-radius:7px;background:linear-gradient(180deg,rgba(0,77,42,.3),rgba(0,25,14,.24));display:flex;align-items:center;justify-content:center;gap:9px;color:#f2fff7;font-size:13px;font-weight:900;letter-spacing:.06em;box-shadow:inset 0 0 16px rgba(0,244,125,.1)}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green),0 0 0 4px rgba(0,244,125,.12)}.check{color:#00f186;font-size:14px}.normal{margin-top:9px;color:#78ebff;font-size:9px;font-weight:800;letter-spacing:.018em;font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;white-space:nowrap;text-shadow:0 0 10px rgba(0,207,255,.65)}
@media(max-width:930px){.weather{transform:scale(calc((100vw - 28px)/900));transform-origin:top right;right:14px}}
</style>
