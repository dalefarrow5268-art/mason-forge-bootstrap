name: Deploy SSX Contact System From Branch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-contact-system-from-branch.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contact-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTACT_SYSTEM_TOKEN: ${{ secrets.CONTACT_SYSTEM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-contact-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contact-worker/package-lock.json
      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CONTACT_SYSTEM_TOKEN" || { echo "Missing CONTACT_SYSTEM_TOKEN"; exit 1; }
      - run: npm ci
      - run: npx wrangler d1 migrations apply mason-forge-cloud --remote
      - run: 'printf "%s" "$CONTACT_SYSTEM_TOKEN" | npx wrangler secret put CONTACT_SYSTEM_TOKEN'
      - run: npx wrangler deploy

