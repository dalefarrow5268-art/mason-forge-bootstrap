name = "mason-forge-cloud"
main = "src/entry.js"
compatibility_date = "2026-07-23"

[vars]
INTAKE_DASHBOARD_SHA256 = "5c3de944e21d1cf2d7890336e6ae260c1f99682f6bf7a250d4bf4ff7d408c820"
MASON_DASHBOARD_TOKEN_SHA256 = "dcb9fe568c3ed1b32b17a17341a2cdaf7af25491d0457e336e3fb18311c78022"
ENVIRONMENT = "production"
SYSTEM_NAME = "Mason Forge Cloud"
OPENAI_MODEL = "gpt-5-mini"
RELEASE_ID = "2026-09-06-phase-four-living-sections"
EVIDENCE_BATCH_SIZE = "20"
OPENAI_REQUEST_TIMEOUT_MS = "600000"

[[d1_databases]]
binding = "DB"
database_name = "mason-forge-cloud"
database_id = "736f655b-889d-4fb2-8948-0a396d39436f"
migrations_dir = "schema"

[[r2_buckets]]
binding = "PROJECT_FILES"
bucket_name = "mason-forge-project-files"

[[queues.producers]]
binding = "DEPARTMENT_QUEUE"
queue = "mason-forge-department-work"

[[queues.producers]]
binding = "HOLDING_SCAN_QUEUE"
queue = "mason-forge-holding-scan"

[[queues.producers]]
binding = "PHASE_ONE_QUEUE"
queue = "mason-forge-phase-one"

[[queues.producers]]
binding = "PHASE_TWO_QUEUE"
queue = "mason-forge-phase-two"

[[queues.producers]]
binding = "PHASE_THREE_QUEUE"
queue = "mason-forge-phase-three"

[[queues.consumers]]
queue = "mason-forge-department-work"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
retry_delay = 120
max_concurrency = 5
dead_letter_queue = "mason-forge-department-dead-letter"

[[queues.consumers]]
queue = "mason-forge-holding-scan"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
retry_delay = 120
max_concurrency = 20
dead_letter_queue = "mason-forge-department-dead-letter"

[[queues.consumers]]
queue = "mason-forge-phase-one"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
retry_delay = 120
max_concurrency = 20
dead_letter_queue = "mason-forge-department-dead-letter"

[[queues.consumers]]
queue = "mason-forge-phase-two"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
retry_delay = 120
max_concurrency = 20
dead_letter_queue = "mason-forge-department-dead-letter"

[[queues.consumers]]
queue = "mason-forge-phase-three"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
retry_delay = 120
max_concurrency = 20
dead_letter_queue = "mason-forge-department-dead-letter"

[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true

# Secrets are already configured in Cloudflare. Never put their plaintext
# values in this file, a ZIP, a chat, or source control.
