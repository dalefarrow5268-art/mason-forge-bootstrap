<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><title>Sign in to Fylvra</title><style>:root{--navy:#06182f;--blue:#176ff2;--ink:#18324f;--muted:#6e8197}*{box-sizing:border-box}body{display:grid;min-width:320px;min-height:100vh;place-items:center;margin:0;background:linear-gradient(135deg,#06182f,#0c3768);font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(420px,calc(100% - 38px));border:1px solid #ffffff2b;border-radius:16px;padding:36px;background:#f9fbfe;box-shadow:0 25px 60px #0005}.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:21px;font-weight:800}.brand img{width:38px;height:38px;object-fit:contain}.eyebrow{margin:30px 0 8px;color:#42617e;font-size:11px;font-weight:800;letter-spacing:.12em}.card h1{margin:0;color:var(--ink);font-size:30px;letter-spacing:-.04em}.card p{color:var(--muted);font-size:14px;line-height:1.5}.reassure{margin:21px 0;padding:12px;border:1px solid #cce0f6;border-radius:9px;background:#eef7ff;color:#486885;font-size:12px;line-height:1.45}.provider,.continue{width:100%;height:50px;margin:9px 0;border-radius:9px;font:700 14px inherit;cursor:pointer}.provider{border:1px solid #d5e0eb;background:#fff;color:#314963}.continue{border:0;background:linear-gradient(135deg,#247cf8,#125bd4);color:#fff}label{display:block;margin-top:21px;color:#3e536a;font-size:12px;font-weight:750}input{width:100%;height:50px;margin-top:8px;border:1px solid #cddae6;border-radius:9px;padding:0 13px;font:14px inherit}.back{display:block;margin-top:25px;color:#3569a7;font-size:13px;font-weight:700;text-align:center;text-decoration:none}.note{margin-top:19px;text-align:center!important;font-size:11px!important}</style></head><body><main class="card"><a class="brand" href="/fylvra.html"><img src="/brand/fylvra-logo-mark-v1.png" alt="" />Fylvra</a><p class="eyebrow">YOUR PROTECTED WORKSPACE</p><h1>Welcome back.</h1><p>Sign in to reach the files and rooms your work depends on.</p><div class="reassure">Private by default. You control access to every room, file, and transfer.</div><button class="provider" data-provider="Google">Continue with Google</button><button class="provider" data-provider="Microsoft">Continue with Microsoft</button><label for="email">Work email</label><input id="email" type="email" placeholder="you@company.com" autocomplete="email" /><button class="continue" id="continue">Continue securely</button><p class="note">Encrypted in transit · Private by default</p><a class="back" href="/fylvra.html">← Back to Fylvra</a></main><script>document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>alert(`Fylvra ${b.dataset.provider} sign-in will open once the production identity connection is enabled.`));document.getElementById('continue').onclick=()=>{const e=document.getElementById('email');if(!e.value||!e.checkValidity())return e.reportValidity();alert('Fylvra will send a secure access link when production authentication is enabled.')};</script></body></html>
