<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mason Forge Weather Instrument</title>
<style>
:root{--cyan:#00c9ff;--cyan2:#0089c9;--gold:#f5d20a;--green:#00ef79;--white:#e9f4fb}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;color:var(--white)}
.stage{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
.instrument{position:absolute;top:8px;right:11px;width:699px;height:106px;display:grid;grid-template-columns:112px 151px 128px 151px 157px;overflow:hidden;background:linear-gradient(180deg,#020b13 0%,#01060b 100%);border:1px solid rgba(0,181,255,.56);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);box-shadow:inset 0 0 0 1px rgba(0,58,96,.55),0 0 18px rgba(0,126,255,.10)}
.instrument:before,.instrument:after{content:"";position:absolute;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,210,255,.52),transparent);pointer-events:none}.instrument:before{top:7px}.instrument:after{bottom:7px}
.corner{position:absolute;width:18px;height:18px;z-index:5;pointer-events:none}.tl{left:3px;top:3px;border-left:2px solid var(--cyan);border-top:2px solid var(--cyan)}.tr{right:3px;top:3px;border-right:2px solid var(--cyan);border-top:2px solid var(--cyan)}.bl{left:3px;bottom:3px;border-left:2px solid #008fcb;border-bottom:2px solid #008fcb}.br{right:3px;bottom:3px;border-right:2px solid #008fcb;border-bottom:2px solid #008fcb}
.cell{position:relative;min-width:0;border-right:1px solid rgba(0,145,212,.28);height:100%}.cell:last-child{border-right:0}.cell:after{content:"";position:absolute;right:7px;top:12px;width:5px;height:1px;background:#007fb8;box-shadow:0 7px 0 rgba(0,127,184,.65),0 14px 0 rgba(0,127,184,.42)}
.label{position:absolute;left:12px;top:10px;color:#06ccf7;font-size:8px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;line-height:1}.label:after{content:"";display:inline-block;width:15px;height:3px;margin-left:4px;border-top:1px solid rgba(0,196,247,.5);border-right:1px solid rgba(0,196,247,.4);vertical-align:middle}
.globe-cell{display:flex;align-items:center;justify-content:center;overflow:hidden;padding-right:3px;background:radial-gradient(circle at 50% 52%,rgba(0,133,255,.10),transparent 62%)}
.globe-hud{position:relative;width:100px;height:96px;display:flex;align-items:center;justify-content:center}
.globe-hud:before,.globe-hud:after{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,205,255,.55),transparent)}
.globe-hud:before{top:7px}.globe-hud:after{bottom:7px}
.hud-bracket{position:absolute;width:15px;height:15px;border-color:rgba(0,206,255,.7);z-index:3}.hb1{left:2px;top:8px;border-left:1px solid;border-top:1px solid}.hb2{right:2px;top:8px;border-right:1px solid;border-top:1px solid}.hb3{left:2px;bottom:8px;border-left:1px solid;border-bottom:1px solid}.hb4{right:2px;bottom:8px;border-right:1px solid;border-bottom:1px solid}
.earth-svg{width:90px;height:90px;overflow:visible;filter:drop-shadow(0 0 7px rgba(0,190,255,.7))}
.earth-grid{transform-origin:80px 80px;animation:gridDrift 52s linear infinite}
.world-strip{animation:worldSpin 34s linear infinite;transform-box:fill-box;transform-origin:center}
.orbit-one{transform-origin:80px 80px;animation:orbitSpin 25s linear infinite}.orbit-two{transform-origin:80px 80px;animation:orbitSpin 42s linear reverse infinite}
@keyframes worldSpin{from{transform:translateX(0)}to{transform:translateX(-160px)}}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
@keyframes gridDrift{to{transform:rotate(360deg)}}
.weather-cell{padding:0 9px}.weather-row{position:absolute;left:12px;top:30px;display:flex;align-items:center;gap:12px}.sun{position:relative;width:31px;height:31px;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 9px rgba(245,210,10,.12)}.sun:before,.sun:after,.sun i:before,.sun i:after{content:"";position:absolute;left:50%;top:50%;width:43px;height:1px;transform:translate(-50%,-50%);background:linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 37px,var(--gold) 37px 43px)}.sun:after{transform:translate(-50%,-50%) rotate(90deg)}.sun i:before{transform:translate(-50%,-50%) rotate(45deg)}.sun i:after{transform:translate(-50%,-50%) rotate(-45deg)}.temp{font-size:27px;font-weight:300;letter-spacing:.01em;color:#eaf3f8;line-height:1}.condition{position:absolute;left:62px;top:65px;font-size:8px;color:#b8c9d4;letter-spacing:.08em;white-space:nowrap}.micro{position:absolute;left:12px;bottom:10px;color:#00bdea;font-size:7px;letter-spacing:.06em;white-space:nowrap}
.time-cell{padding:0 10px}.time-row{position:absolute;left:12px;top:32px;display:flex;align-items:flex-end;gap:6px}.time-value{font-family:Consolas,"Courier New",monospace;font-size:27px;font-weight:300;letter-spacing:.02em;color:#e8f1f7;line-height:1}.ampm{font-size:8px;padding-bottom:3px;color:#eef4f8}.zone{position:absolute;left:76px;top:67px;font-size:8px;color:#ccd6dc;letter-spacing:.06em}
.date-cell{padding:0 10px}.date-value{position:absolute;left:12px;top:46px;color:#f2d20b;font-size:10px;font-weight:700;letter-spacing:.035em;white-space:nowrap}.coords{position:absolute;left:12px;bottom:10px;color:#047db0;font-size:7px;letter-spacing:.045em;white-space:nowrap}
.status-cell{display:flex;flex-direction:column;align-items:center;padding:0 11px}.welcome{margin-top:18px;color:#00c1ef;font-size:9px;letter-spacing:.02em}.safe{margin-top:8px;width:105px;height:30px;border:1px solid rgba(0,239,121,.78);border-radius:5px;background:linear-gradient(180deg,rgba(0,71,39,.23),rgba(0,24,13,.20));display:flex;align-items:center;justify-content:center;gap:7px;color:#e9fff3;font-size:9px;letter-spacing:.06em;box-shadow:inset 0 0 12px rgba(0,239,121,.07)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green),0 0 0 3px rgba(0,239,121,.10)}.check{color:#00f186;font-size:10px}.normal{margin-top:7px;color:#00bce9;font-size:7px;letter-spacing:.10em}
@media(max-width:760px){.instrument{transform:scale(calc((100vw - 20px)/699));transform-origin:top right;right:10px}}
</style>
</head>
<body>
<main class="stage">
<section class="instrument" aria-label="Weather date and time instrument">
<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
<div class="cell globe-cell">
  <div class="globe-hud">
    <span class="hud-bracket hb1"></span><span class="hud-bracket hb2"></span><span class="hud-bracket hb3"></span><span class="hud-bracket hb4"></span>
    <svg class="earth-svg" viewBox="0 0 160 160" aria-label="Slowly rotating digital globe">
      <defs>
        <radialGradient id="ocean" cx="36%" cy="28%" r="74%"><stop offset="0" stop-color="#19ddff" stop-opacity=".78"/><stop offset=".18" stop-color="#087eb9" stop-opacity=".75"/><stop offset=".52" stop-color="#02416d" stop-opacity=".92"/><stop offset=".82" stop-color="#001326"/><stop offset="1" stop-color="#00050c"/></radialGradient>
        <radialGradient id="shine" cx="32%" cy="24%" r="68%"><stop offset="0" stop-color="#a7f4ff" stop-opacity=".55"/><stop offset=".28" stop-color="#0cc7ff" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
        <pattern id="landDots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="1.05" fill="#36dbff"/><circle cx="4" cy="4" r=".55" fill="#0b90c8"/></pattern>
        <pattern id="microDots" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".38" fill="#14c8f4" opacity=".65"/></pattern>
        <clipPath id="sphereClip"><circle cx="80" cy="80" r="57"/></clipPath>
        <filter id="cyanGlow"><feGaussianBlur stdDeviation="1.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <circle cx="80" cy="80" r="69" fill="none" stroke="#008ac6" stroke-width=".7" stroke-dasharray="2 5" opacity=".55"/>
      <circle cx="80" cy="80" r="64" fill="none" stroke="#00b9ef" stroke-width=".8" opacity=".4"/>
      <g class="orbit-one" fill="none" stroke="#00c8ff" stroke-width=".8" opacity=".48"><ellipse cx="80" cy="80" rx="72" ry="41" transform="rotate(-28 80 80)"/><circle cx="18" cy="49" r="2" fill="#ff8217" stroke="none"/></g>
      <g class="orbit-two" fill="none" stroke="#006fa9" stroke-width=".7" opacity=".45"><ellipse cx="80" cy="80" rx="74" ry="54" transform="rotate(23 80 80)"/><circle cx="143" cy="55" r="1.7" fill="#ff9a20" stroke="none"/></g>
      <circle cx="80" cy="80" r="57" fill="url(#ocean)" stroke="#18d5ff" stroke-width="1.2"/><circle cx="80" cy="80" r="57" fill="url(#shine)"/>
      <g clip-path="url(#sphereClip)">
        <g class="earth-grid" fill="none" stroke="#1ccaf0" stroke-width=".55" opacity=".34"><ellipse cx="80" cy="80" rx="57" ry="16"/><ellipse cx="80" cy="80" rx="57" ry="31"/><ellipse cx="80" cy="80" rx="57" ry="45"/><ellipse cx="80" cy="80" rx="18" ry="57"/><ellipse cx="80" cy="80" rx="35" ry="57"/><ellipse cx="80" cy="80" rx="49" ry="57"/></g>
        <g class="world-strip" filter="url(#cyanGlow)">
          <g transform="translate(0,0)"><path d="M31 35l13-7 16 2 7 8-4 8-8 1-2 8 7 8-4 8-11-5-5 8-7-4-4-14-8-6 3-10z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/><path d="M54 74l10 2 8 9-1 13-7 11-2 18-8 13-6-6 1-15-6-12 3-13-4-11z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/><path d="M93 36l15-8 22 4 10 8-2 8-14 5-5 9 14 7-4 8-12-2-8 8-4 12-8-1-8-12-12-5-7-11 6-9 11-5z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/><path d="M104 87l10 2 6 8-3 16-8 19-7-4-2-15-7-9 4-13z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/><path d="M132 108l10 3 5 8-8 6-11-5z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/></g>
          <g transform="translate(160,0)"><path d="M31 35l13-7 16 2 7 8-4 8-8 1-2 8 7 8-4 8-11-5-5 8-7-4-4-14-8-6 3-10z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/><path d="M54 74l10 2 8 9-1 13-7 11-2 18-8 13-6-6 1-15-6-12 3-13-4-11z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/><path d="M93 36l15-8 22 4 10 8-2 8-14 5-5 9 14 7-4 8-12-2-8 8-4 12-8-1-8-12-12-5-7-11 6-9 11-5z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/><path d="M104 87l10 2 6 8-3 16-8 19-7-4-2-15-7-9 4-13z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/><path d="M132 108l10 3 5 8-8 6-11-5z" fill="url(#landDots)" stroke="#42ddff" stroke-width=".7"/></g>
        </g>
        <circle cx="80" cy="80" r="56" fill="url(#microDots)" opacity=".18"/><path d="M23 96c26 12 80 15 113-4" fill="none" stroke="#60e7ff" stroke-width=".7" opacity=".32"/>
      </g>
      <circle cx="80" cy="80" r="57" fill="none" stroke="#55e8ff" stroke-width=".9" opacity=".82"/>
      <circle cx="51" cy="50" r="2" fill="#ff8c15"/><circle cx="111" cy="63" r="1.7" fill="#ff8c15"/><circle cx="74" cy="112" r="1.5" fill="#ff8c15"/>
      <path d="M12 80h13M135 80h13M80 12v12M80 136v12" stroke="#00c8ff" stroke-width="1" opacity=".65"/>
    </svg>
  </div>
</div>
<div class="cell weather-cell"><span class="label">Weather</span><div class="weather-row"><div class="sun"><i></i></div><div class="temp">72°F</div></div><div class="condition">CLEAR SKIES</div><div class="micro">HUM 38% &nbsp;|&nbsp; WIND 6 MPH NE</div></div>
<div class="cell time-cell"><span class="label">Time</span><div class="time-row"><span class="time-value" id="time">07:24</span><span class="ampm" id="ampm">AM</span></div><div class="zone">PDT</div></div>
<div class="cell date-cell"><span class="label">Date</span><div class="date-value" id="date">SUN, JULY 27, 2025</div><div class="coords">LAT 34.0322° N &nbsp;|&nbsp; LON 118.2437° W</div></div>
<div class="cell status-cell"><div class="welcome">Welcome back,</div><div class="safe"><span class="dot"></span><span>SITE SAFE</span><span class="check">✓</span></div><div class="normal">ALL SYSTEMS NORMAL</div></div>
</section>
</main>
<script>
const time=document.getElementById('time'),ampm=document.getElementById('ampm'),date=document.getElementById('date');
function update(){const d=new Date();let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;time.textContent=String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');ampm.textContent=ap;date.textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase()}
update();setInterval(update,1000);
</script>
</body>
</html>
