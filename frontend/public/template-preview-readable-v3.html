<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Weather Instrument V3</title>
<style>
:root{--cyan:#00caff;--gold:#f4d40b;--green:#00f27d;--white:#edf8ff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}body{font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;color:var(--white)}
.stage{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
.instrument{position:absolute;top:10px;right:12px;width:790px;height:122px;display:grid;grid-template-columns:128px 172px 145px 170px 175px;overflow:hidden;background:linear-gradient(180deg,#020c15,#01060b);border:1px solid rgba(0,190,255,.62);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);box-shadow:inset 0 0 0 1px rgba(0,63,104,.58),0 0 20px rgba(0,126,255,.12)}
.instrument:before,.instrument:after{content:"";position:absolute;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,217,255,.62),transparent)}.instrument:before{top:8px}.instrument:after{bottom:8px}
.corner{position:absolute;width:20px;height:20px;z-index:5}.tl{left:3px;top:3px;border-left:2px solid var(--cyan);border-top:2px solid var(--cyan)}.tr{right:3px;top:3px;border-right:2px solid var(--cyan);border-top:2px solid var(--cyan)}.bl{left:3px;bottom:3px;border-left:2px solid #009bd7;border-bottom:2px solid #009bd7}.br{right:3px;bottom:3px;border-right:2px solid #009bd7;border-bottom:2px solid #009bd7}
.cell{position:relative;min-width:0;height:100%;border-right:1px solid rgba(0,159,226,.32)}.cell:last-child{border-right:0}.cell:after{content:"";position:absolute;right:8px;top:13px;width:6px;height:1px;background:#008bc5;box-shadow:0 8px 0 rgba(0,139,197,.68),0 16px 0 rgba(0,139,197,.44)}
.label{position:absolute;left:14px;top:12px;color:#10d7ff;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1}.label:after{content:"";display:inline-block;width:18px;height:4px;margin-left:5px;border-top:1px solid rgba(0,214,255,.65);border-right:1px solid rgba(0,214,255,.5);vertical-align:middle}
.globe-cell{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000208}
.globe-hud{position:relative;width:112px;height:108px;display:flex;align-items:center;justify-content:center;isolation:isolate;overflow:hidden;border-radius:10px}
.globe-hud:before,.globe-hud:after{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,216,255,.62),transparent);z-index:4}.globe-hud:before{top:7px}.globe-hud:after{bottom:7px}
.starfield,.starfield:before,.starfield:after{position:absolute;inset:0;content:"";pointer-events:none}
.starfield{z-index:0;opacity:.9;background-color:#00020a;background-image:radial-gradient(circle,#fff 0 .7px,transparent .9px),radial-gradient(circle,#6bdfff 0 .65px,transparent .9px),radial-gradient(circle,#d7f7ff 0 .5px,transparent .8px),radial-gradient(circle,#5f8cff 0 .55px,transparent .85px);background-size:7px 7px,11px 11px,13px 13px,17px 17px;background-position:0 0,3px 5px,8px 2px,4px 11px;animation:starDrift 90s linear infinite}
.starfield:before{opacity:.65;background-image:radial-gradient(circle,#fff 0 .6px,transparent .85px),radial-gradient(circle,#25cfff 0 .5px,transparent .8px);background-size:9px 9px,15px 15px;background-position:5px 1px,2px 7px;animation:twinkle 4s ease-in-out infinite alternate}
.starfield:after{opacity:.45;background-image:radial-gradient(circle,#fff 0 .45px,transparent .75px);background-size:5px 5px;background-position:2px 3px;animation:twinkle 6s ease-in-out infinite alternate-reverse}
@keyframes starDrift{to{background-position:70px 35px,58px 41px,76px 29px,91px 52px}}@keyframes twinkle{from{opacity:.28}to{opacity:.72}}
.hud-bracket{position:absolute;width:17px;height:17px;border-color:rgba(0,216,255,.8);z-index:5}.hb1{left:2px;top:8px;border-left:1px solid;border-top:1px solid}.hb2{right:2px;top:8px;border-right:1px solid;border-top:1px solid}.hb3{left:2px;bottom:8px;border-left:1px solid;border-bottom:1px solid}.hb4{right:2px;bottom:8px;border-right:1px solid;border-bottom:1px solid}
.earth-svg{position:relative;z-index:2;width:103px;height:103px;overflow:visible;filter:drop-shadow(0 0 9px rgba(0,195,255,.78))}.world{transform-origin:80px 80px;animation:earthSpin 38s linear infinite}.orbit-one{transform-origin:80px 80px;animation:orbitSpin 28s linear infinite}.orbit-two{transform-origin:80px 80px;animation:orbitSpin 46s linear reverse infinite}@keyframes earthSpin{to{transform:rotate(360deg)}}@keyframes orbitSpin{to{transform:rotate(360deg)}}
.weather-row{position:absolute;left:14px;top:34px;display:flex;align-items:center;gap:14px}.sun{position:relative;width:35px;height:35px;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 10px rgba(244,212,11,.16)}.sun:before,.sun:after,.sun i:before,.sun i:after{content:"";position:absolute;left:50%;top:50%;width:49px;height:1px;transform:translate(-50%,-50%);background:linear-gradient(90deg,var(--gold) 0 7px,transparent 7px 42px,var(--gold) 42px 49px)}.sun:after{transform:translate(-50%,-50%) rotate(90deg)}.sun i:before{transform:translate(-50%,-50%) rotate(45deg)}.sun i:after{transform:translate(-50%,-50%) rotate(-45deg)}.temp{font-size:31px;font-weight:300;color:#f0f8fd}.condition{position:absolute;left:70px;top:76px;font-size:10px;font-weight:700;color:#dce8ee;letter-spacing:.08em;white-space:nowrap}.micro{position:absolute;left:13px;bottom:10px;color:#56e2ff;font-size:10.5px;font-weight:800;letter-spacing:.025em;white-space:nowrap;text-shadow:0 0 8px rgba(0,202,255,.42)}
.time-row{position:absolute;left:14px;top:39px;display:flex;align-items:flex-end;gap:7px}.time-value{font-family:Consolas,"Courier New",monospace;font-size:31px;font-weight:300;letter-spacing:.02em}.ampm{font-size:10px;padding-bottom:4px}.zone{position:absolute;left:87px;top:79px;font-size:10px;font-weight:700;color:#d7e2e8;letter-spacing:.08em}
.date-value{position:absolute;left:14px;top:52px;color:#f4d40b;font-size:11.5px;font-weight:800;letter-spacing:.035em;white-space:nowrap}.coords{position:absolute;left:12px;bottom:10px;color:#55e0ff;font-size:10px;font-weight:800;letter-spacing:.012em;white-space:nowrap;text-shadow:0 0 8px rgba(0,202,255,.42)}
.status-cell{display:flex;flex-direction:column;align-items:center}.welcome{margin-top:16px;color:#66e5ff;font-size:13px;font-weight:800;letter-spacing:.025em;text-shadow:0 0 8px rgba(0,202,255,.45)}.safe{margin-top:8px;width:121px;height:34px;border:1px solid rgba(0,242,125,.82);border-radius:6px;background:linear-gradient(180deg,rgba(0,77,42,.26),rgba(0,25,14,.22));display:flex;align-items:center;justify-content:center;gap:8px;color:#effff6;font-size:11px;font-weight:800;letter-spacing:.06em;box-shadow:inset 0 0 14px rgba(0,242,125,.08)}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green),0 0 0 4px rgba(0,242,125,.10)}.check{color:#00f186;font-size:12px}.normal{margin-top:8px;color:#60e3ff;font-size:10.5px;font-weight:800;letter-spacing:.055em;white-space:nowrap;text-shadow:0 0 8px rgba(0,202,255,.40)}
@media(max-width:850px){.instrument{transform:scale(calc((100vw - 24px)/790));transform-origin:top right;right:12px}}
</style>
</head>
<body>
<main class="stage"><section class="instrument" aria-label="Weather date and time instrument"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
<div class="cell globe-cell"><div class="globe-hud"><div class="starfield"></div><span class="hud-bracket hb1"></span><span class="hud-bracket hb2"></span><span class="hud-bracket hb3"></span><span class="hud-bracket hb4"></span>
<svg class="earth-svg" viewBox="0 0 160 160" aria-label="Slowly rotating digital globe"><defs><radialGradient id="ocean" cx="36%" cy="28%" r="74%"><stop offset="0" stop-color="#1ce3ff" stop-opacity=".88"/><stop offset=".2" stop-color="#087eb9" stop-opacity=".82"/><stop offset=".58" stop-color="#023c67"/><stop offset="1" stop-color="#00040a"/></radialGradient><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1" fill="#54e7ff"/><circle cx="4" cy="4" r=".55" fill="#0b90c8"/></pattern><clipPath id="sphere"><circle cx="80" cy="80" r="57"/></clipPath><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g class="orbit-one" fill="none" stroke="#00c8ff" stroke-width=".9" opacity=".62"><ellipse cx="80" cy="80" rx="72" ry="41" transform="rotate(-28 80 80)"/><circle cx="18" cy="49" r="2" fill="#ff8217" stroke="none"/></g><g class="orbit-two" fill="none" stroke="#006fa9" stroke-width=".8" opacity=".55"><ellipse cx="80" cy="80" rx="74" ry="54" transform="rotate(23 80 80)"/><circle cx="143" cy="55" r="1.7" fill="#ff9a20" stroke="none"/></g><circle cx="80" cy="80" r="64" fill="none" stroke="#00b9ef" stroke-width=".9" opacity=".5"/><circle cx="80" cy="80" r="57" fill="url(#ocean)" stroke="#18d5ff" stroke-width="1.4"/><g clip-path="url(#sphere)"><g fill="none" stroke="#1ccaf0" stroke-width=".6" opacity=".38"><ellipse cx="80" cy="80" rx="57" ry="16"/><ellipse cx="80" cy="80" rx="57" ry="31"/><ellipse cx="80" cy="80" rx="57" ry="45"/><ellipse cx="80" cy="80" rx="18" ry="57"/><ellipse cx="80" cy="80" rx="35" ry="57"/><ellipse cx="80" cy="80" rx="49" ry="57"/></g><g class="world" filter="url(#glow)"><path d="M31 35l13-7 16 2 7 8-4 8-8 1-2 8 7 8-4 8-11-5-5 8-7-4-4-14-8-6 3-10z" fill="url(#dots)" stroke="#55e3ff" stroke-width=".8"/><path d="M54 74l10 2 8 9-1 13-7 11-2 18-8 13-6-6 1-15-6-12 3-13-4-11z" fill="url(#dots)" stroke="#55e3ff" stroke-width=".8"/><path d="M93 36l15-8 22 4 10 8-2 8-14 5-5 9 14 7-4 8-12-2-8 8-4 12-8-1-8-12-12-5-7-11 6-9 11-5z" fill="url(#dots)" stroke="#55e3ff" stroke-width=".8"/><path d="M104 87l10 2 6 8-3 16-8 19-7-4-2-15-7-9 4-13z" fill="url(#dots)" stroke="#55e3ff" stroke-width=".8"/><path d="M132 108l10 3 5 8-8 6-11-5z" fill="url(#dots)" stroke="#55e3ff" stroke-width=".8"/></g></g><circle cx="80" cy="80" r="57" fill="none" stroke="#68ecff" stroke-width="1" opacity=".9"/><circle cx="51" cy="50" r="2" fill="#ff8c15"/><circle cx="111" cy="63" r="1.7" fill="#ff8c15"/><circle cx="74" cy="112" r="1.5" fill="#ff8c15"/></svg></div></div>
<div class="cell"><span class="label">Weather</span><div class="weather-row"><div class="sun"><i></i></div><div class="temp">72°F</div></div><div class="condition">CLEAR SKIES</div><div class="micro">HUMIDITY 38% &nbsp;|&nbsp; WIND 6 MPH NE</div></div>
<div class="cell"><span class="label">Time</span><div class="time-row"><span class="time-value" id="time">07:24</span><span class="ampm" id="ampm">AM</span></div><div class="zone">PDT</div></div>
<div class="cell"><span class="label">Date</span><div class="date-value" id="date">SUN, JULY 27, 2025</div><div class="coords">LAT 34.0322° N &nbsp;|&nbsp; LON 118.2437° W</div></div>
<div class="cell status-cell"><div class="welcome">Welcome Back,</div><div class="safe"><span class="dot"></span><span>SITE SAFE</span><span class="check">✓</span></div><div class="normal">ALL SYSTEMS NORMAL</div></div></section></main>
<script>const time=document.getElementById('time'),ampm=document.getElementById('ampm'),date=document.getElementById('date');function update(){const d=new Date();let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;time.textContent=String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');ampm.textContent=ap;date.textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase()}update();setInterval(update,1000);</script>
</body></html>
