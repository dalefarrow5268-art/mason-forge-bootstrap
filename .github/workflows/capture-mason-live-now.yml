name: Capture Mason Forge Live Now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-mason-live-now.yml"
      - "verification/live-snapshot-trigger.txt"

permissions:
  contents: write

concurrency:
  group: mason-forge-live-snapshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for current release
        run: sleep 20

      - name: Capture live state
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const proxy = 'https://mason-forge-live.vercel.app/api/mason';
          const call = async (url) => {
            try {
              const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}_live=${Date.now()}-${Math.random()}`, {
                cache: 'no-store',
                signal: AbortSignal.timeout(25000),
                headers: { 'cache-control': 'no-store, no-cache, max-age=0', pragma: 'no-cache' },
              });
              const text = await response.text();
              let body;
              try { body = JSON.parse(text); } catch { body = { raw: text }; }
              return { ok: response.ok, status: response.status, body };
            } catch (error) {
              return { ok: false, status: 0, error: String(error?.stack || error) };
            }
          };
          const viaProxy = (path) => `${proxy}?path=${encodeURIComponent(path)}`;
          const endpointEntries = [
            ['health', 'https://mason-forge-cloud.mason-forge-ssx.workers.dev/health'],
            ['bootstrap', proxy],
          ];
          for (const projectId of [4, 5]) {
            for (const endpoint of ['files', 'tasks', 'outputs', 'evidence', 'continuity']) {
              endpointEntries.push([`${projectId}:${endpoint}`, viaProxy(`api/projects/${projectId}/${endpoint}`)]);
            }
          }
          const results = Object.fromEntries(await Promise.all(endpointEntries.map(async ([key, url]) => [key, await call(url)])));
          const report = {
            capturedAt: new Date().toISOString(),
            sourceCommit: process.env.GITHUB_SHA,
            healthResponse: results.health,
            bootstrapResponse: results.bootstrap,
            health: results.health?.body || null,
            bootstrap: results.bootstrap?.body || null,
            projects: {},
            requestErrors: [],
          };
          for (const [key, result] of Object.entries(results)) if (!result?.ok) report.requestErrors.push({ endpoint: key, response: result });
          for (const projectId of [4, 5]) {
            const files = results[`${projectId}:files`]?.body || {};
            const tasks = results[`${projectId}:tasks`]?.body || {};
            const outputs = results[`${projectId}:outputs`]?.body || {};
            const evidence = results[`${projectId}:evidence`]?.body || {};
            const continuity = results[`${projectId}:continuity`]?.body || {};
            const fileStatusCounts = {};
            const extractionFailureReasons = {};
            for (const file of files.files || []) {
              const status = String(file.review_status || 'UNKNOWN');
              fileStatusCounts[status] = (fileStatusCounts[status] || 0) + 1;
              if (status.startsWith('EXTRACTION FAILED:')) extractionFailureReasons[status] = (extractionFailureReasons[status] || 0) + 1;
            }
            const taskCounts = {};
            for (const task of tasks.tasks || []) taskCounts[task.status || 'UNKNOWN'] = (taskCounts[task.status || 'UNKNOWN'] || 0) + 1;
            report.projects[projectId] = {
              fileCount: (files.files || []).length,
              fileStatusCounts,
              extractionFailureReasons,
              taskCount: (tasks.tasks || []).length,
              taskCounts,
              outputCount: (outputs.outputs || []).length,
              evidenceBatchCount: (evidence.batches || []).length,
              routedFileCount: (evidence.files || []).filter((file) => file.batch_id).length,
              continuity: continuity.continuity || null,
            };
          }
          report.successCriteria = {
            allRequestsSucceeded: report.requestErrors.length === 0,
            operationalReady: report.health?.operationalReady === true,
            continuityVerified: report.health?.continuity?.verification_status === 'VERIFIED' && Boolean(report.bootstrap?.continuity),
            zeroBlockedTasks: Number(report.health?.taskTotals?.BLOCKED || 0) === 0,
            countsReconcile: report.health?.countsReconcile === true,
            extractionProgressing: Number(report.health?.extraction?.extracted || 0) > 0,
            zeroExtractionFailures: Number(report.health?.extraction?.failed || 0) === 0,
            evidenceTasksCreated: Object.values(report.projects).some((project) => project.taskCount > 5),
            evidenceOutputsCreated: Object.values(report.projects).some((project) => project.outputCount > 5),
          };
          report.success = Object.values(report.successCriteria).every(Boolean);
          await fs.mkdir('verification', { recursive: true });
          await fs.writeFile('verification/live-now.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Publish live state
        if: always()
        run: |
          test -f verification/live-now.json || {
            mkdir -p verification
            printf '%s\n' '{"success":false,"requestErrors":[{"error":"Live capture report was not produced."}]}' > verification/live-now.json
          }
          report_path="${RUNNER_TEMP}/mason-live-now.json"
          report_worktree="${RUNNER_TEMP}/mason-live-snapshot"
          cp verification/live-now.json "${report_path}"
          git fetch origin live-snapshot
          git worktree add --detach "${report_worktree}" origin/live-snapshot
          mkdir -p "${report_worktree}/verification"
          cp "${report_path}" "${report_worktree}/verification/live-now.json"
          git -C "${report_worktree}" config user.name "Mason Forge Live Capture"
          git -C "${report_worktree}" config user.email "actions@users.noreply.github.com"
          git -C "${report_worktree}" add verification/live-now.json
          if ! git -C "${report_worktree}" diff --cached --quiet; then
            git -C "${report_worktree}" commit -m "Capture Mason Forge live state for ${GITHUB_SHA}"
            git -C "${report_worktree}" push origin HEAD:live-snapshot
          fi
