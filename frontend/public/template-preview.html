.corner{position:absolute;width:23px;height:23px;z-index:5}.tl{left:4px;top:4px;border-left:3px solid var(--cyan);border-top:3px solid var(--cyan)}.tr{right:4px;top:4px;border-right:3px solid var(--cyan);border-top:3px solid var(--cyan)}.bl{left:4px;bottom:4px;border-left:3px solid #008fcb;border-bottom:3px solid #008fcb}.br{right:4px;bottom:4px;border-right:3px solid #008fcb;border-bottom:3px solid #008fcb}

.earth-real{position:relative;width:104px;height:104px;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 14px rgba(0,207,255,.9),inset 0 0 16px rgba(0,211,255,.36)}.earth-real:after{content:"";position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 32% 22%,rgba(170,251,255,.24),transparent 30%),radial-gradient(ellipse at 103% 50%,rgba(0,1,10,.86),transparent 49%),linear-gradient(90deg,rgba(0,218,255,.12),transparent 35%,rgba(0,0,12,.28))}.earth-surface{position:absolute;z-index:1;left:0;top:0;width:400%;height:100%;display:flex;animation:earthPan 120s linear infinite reverse}.earth-surface img{display:block;flex:0 0 50%;width:50%;height:100%;object-fit:fill;filter:saturate(1.12) contrast(1.07) brightness(.94)}@keyframes earthPan{to{transform:translateX(-50%)}}.world{animation:worldSpin 46s linear infinite reverse}.grid{transform-origin:80px 80px;animation:gridSpin 76s linear infinite reverse}.orbit1{transform-origin:80px 80px;animation:orbit 32s linear infinite}.orbit2{transform-origin:80px 80px;animation:orbit 54s linear reverse infinite}@keyframes worldSpin{from{transform:translateX(0)}to{transform:translateX(-160px)}}@keyframes gridSpin{to{transform:rotate(360deg)}}@keyframes orbit{to{transform:rotate(360deg)}}
.sunrow{position:absolute;left:16px;top:42px;display:flex;align-items:center;gap:16px}.sun{position:relative;width:39px;height:39px;border:2px solid var(--gold);border-radius:50%;filter:drop-shadow(0 0 6px rgba(245,210,10,.35))}.sun:before,.sun:after,.sun i:before,.sun i:after{content:"";position:absolute;left:50%;top:50%;width:56px;height:2px;transform:translate(-50%,-50%);background:linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 48px,var(--gold) 48px 56px)}.sun:after{transform:translate(-50%,-50%) rotate(90deg)}.sun i:before{transform:translate(-50%,-50%) rotate(45deg)}.sun i:after{transform:translate(-50%,-50%) rotate(-45deg)}.temp{font-size:36px;font-weight:300;line-height:1;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.2)}.condition{position:absolute;left:82px;top:86px;font-size:13px;font-weight:800;color:#e8f3f8;letter-spacing:.08em;white-space:nowrap}.micro{position:absolute;left:14px;bottom:12px;color:#0bd9ff;font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1;white-space:nowrap;text-shadow:0 0 7px rgba(0,207,255,.4)}
.timerow{position:absolute;left:18px;top:45px;display:flex;align-items:flex-end;gap:8px}.time{font-family:Consolas,"Courier New",monospace;font-size:38px;font-weight:300;line-height:1;color:#fff}.ampm{font-size:13px;font-weight:800;padding-bottom:5px;color:#fff}.zone{position:absolute;left:100px;top:92px;font-size:13px;font-weight:900;color:#e7f2f8;letter-spacing:.08em}
.dateval{position:absolute;left:16px;top:53px;color:var(--gold);font-family:Consolas,"Courier New",monospace;font-size:20px;font-weight:400;letter-spacing:.045em;line-height:1;white-space:nowrap;text-shadow:0 0 8px rgba(245,210,10,.2)}.coords{position:absolute;left:14px;bottom:12px;color:#0bd9ff;font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1;white-space:nowrap;text-shadow:0 0 7px rgba(0,207,255,.4)}
.status{display:flex;flex-direction:column;align-items:center}.welcome{margin-top:14px;color:#0bd9ff;font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1;text-shadow:0 0 7px rgba(0,207,255,.4)}.safe{margin-top:9px;width:142px;height:40px;border:1px solid rgba(0,244,125,.9);font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;border-radius:7px;background:linear-gradient(180deg,rgba(0,77,42,.3),rgba(0,25,14,.24));display:flex;align-items:center;justify-content:center;gap:9px;color:#f2fff7;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;box-shadow:inset 0 0 16px rgba(0,244,125,.1)}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green),0 0 0 4px rgba(0,244,125,.12)}.check{color:#00f186;font-size:14px}.normal{margin-top:9px;color:#0bd9ff;font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1;white-space:nowrap;text-shadow:0 0 7px rgba(0,207,255,.4)}

tom:12px;height:58px;z-index:5;display:flex;align-items:center;border:1px solid rgba(0,188,244,.7);border-radius:6px;background:linear-gradient(180deg,rgba(2,17,27,.92),rgba(1,8,14,.96));box-shadow:inset 0 0 14px rgba(0,132,202,.08)}.scout-composer input{width:100%;height:100%;border:0;outline:0;background:transparent;padding:0 48px 0 12px;color:#effbff;font:14px/1 "Arial Narrow","Segoe UI",Arial,sans-serif}.scout-composer input::placeholder{color:#8093a0}.scout-mic{position:absolute;right:13px;top:17px;width:15px;height:20px;border:0;background:transparent;padding:0}.scout-mic:before{content:"";position:absolute;left:4px;top:0;width:6px;height:11px;border:1px solid #d3e8f1;border-radius:5px}.scout-mic:after{content:"";position:absolute;left:2px;top:8px;width:10px;height:8px;border-bottom:1px solid #d3e8f1;border-left:1px solid #d3e8f1;border-right:1px solid #d3e8f1;border-radius:0 0 7px 7px;box-shadow:4px 8px 0 -3px #d3e8f1}
.scout-wave{position:absolute;left:25px;right:25px;bottom:78px;height:26px;z-index:5;display:flex;align-items:center;justify-content:center;gap:3px;pointer-events:none}.scout-wave:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,202,255,.24)}.scout-wave i{position:relative;z-index:1;width:2px;height:100%;border-radius:2px;background:#05ceff;box-shadow:0 0 5px rgba(0,207,255,.72);transform:scaleY(var(--idle));transform-origin:center;transition:transform .22s ease,opacity .22s ease;opacity:.66}.scout-panel.is-speaking .scout-wave i{opacity:1;animation:scoutVoice .62s ease-in-out infinite alternate;animation-delay:var(--delay)}@keyframes scoutVoice{0%{transform:scaleY(.16)}100%{transform:scaleY(var(--talk))}}@media(prefers-reduced-motion:reduce){.scout-panel.is-speaking .scout-wave i{animation:none;transform:scaleY(.7)}}.ssx-command-mark{position:absolute;left:50%;top:50%;width:min(48vw,860px);z-index:1;transform:translate(-50%,-50%);line-height:0;filter:drop-shadow(0 0 18px rgba(0,151,255,.16))}.ssx-command-mark img{display:block;width:100%;height:auto}\n.mf-weave{position:absolute;left:0;right:0;top:116px;height:42px;z-index:2;pointer-events:none}.mf-weave canvas{display:block;width:100%;height:100%}\n@media(max-width:930px){.mf-brand{width:360px;left:14px;top:12px}.scout-panel{transform:scale(.72);transform-origin:bottom left;left:14px;bottom:14px}.weather{transform:scale(calc((100vw - 28px)/990));transform-origin:top right;right:14px}}

<script>const time=document.getElementById('time'),ampm=document.getElementById('ampm'),date=document.getElementById('date');function update(){const d=new Date();let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;time.textContent=String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');ampm.textContent=ap;date.textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase().replace(/,/g,'')}update();setInterval(update,1000);;const scoutPanel=document.querySelector(".scout-panel");window.ScoutVoice={start(){scoutPanel?.classList.add("is-speaking")},stop(){scoutPanel?.classList.remove("is-speaking")},speak(message){if(!("speechSynthesis" in window)||!message)return;const voice=new SpeechSynthesisUtterance(message);voice.onstart=()=>this.start();voice.onend=voice.onerror=()=>this.stop();window.speechSynthesis.cancel();window.speechSynthesis.speak(voice)}};
const weave=document.getElementById("mfWeave");if(weave){const ctx=weave.getContext("2d");const paint=()=>{const d=Math.min(devicePixelRatio||1,2),r=weave.getBoundingClientRect(),w=r.width,h=r.height;weave.width=Math.round(w*d);weave.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);const y=(x,p,a=1)=>h*.52+Math.sin((x/w)*Math.PI*3.2+p)*9*a+Math.sin((x/w)*Math.PI*7.2+p)*2.6*a;const stroke=(p,alpha,width,amp=1)=>{ctx.beginPath();for(let x=0;x<=w;x+=4){const yy=y(x,p,amp);x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.strokeStyle="rgba(242,157,22,"+alpha+")";ctx.lineWidth=width;ctx.stroke()};ctx.lineCap="round";ctx.shadowColor="rgba(255,138,0,.75)";ctx.shadowBlur=20;stroke(0,.50,1.2,1);stroke(Math.PI,.44,1.15,1);ctx.shadowBlur=11;stroke(Math.PI*.34,.40,.76,.68);stroke(Math.PI*1.38,.34,.72,.58);stroke(Math.PI*.76,.30,.62,1.24);ctx.shadowBlur=0;for(let i=0;i<60;i++){const x=w*((i*.071+.021)%1),py=h*.52+Math.sin(i*2.73)*15+(i%5-2)*1.7;const size=i%11===0?1.7:i%4===0?1:.55;const alpha=i%11===0?.78:i%4===0?.42:.16;ctx.fillStyle="rgba(246,163,23,"+alpha+")";ctx.beginPath();ctx.arc(x,py,size,0,Math.PI*2);ctx.fill()}for(let i=0;i<13;i++){const x=w*(.035+i*.077),py=y(x,i%3?Math.PI:0,1);const radius=i%4===0?7:i%3===0?4:2.4;const g=ctx.createRadialGradient(x,py,0,x,py,radius);g.addColorStop(0,"rgba(255,248,194,.98)");g.addColorStop(.2,"rgba(255,191,50,.88)");g.addColorStop(.55,"rgba(255,132,7,.34)");g.addColorStop(1,"rgba(255,109,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,py,radius,0,Math.PI*2);ctx.fill()}const cx=w*.52,cy=h*.52;const core=ctx.createRadialGradient(cx,cy,0,cx,cy,28);core.addColorStop(0,"rgba(255,251,205,.92)");core.addColorStop(.10,"rgba(255,198,62,.8)");core.addColorStop(.38,"rgba(255,133,8,.25)");core.addColorStop(1,"rgba(255,103,0,0)");ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,28,0,Math.PI*2);ctx.fill();ctx.fillStyle="rgba(255,243,177,.92)";ctx.beginPath();ctx.arc(cx,cy,1.5,0,Math.PI*2);ctx.fill()};paint();addEventListener("resize",paint)};
</script>
