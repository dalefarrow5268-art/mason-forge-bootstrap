<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mason Forge Weather Instrument - Readable V3</title>
<style>
:root{--cyan:#00cfff;--cyan2:#63e8ff;--gold:#f5d20a;--green:#00f47d;--white:#f2fbff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:var(--white);font-family:"Arial Narrow","Segoe UI",Arial,sans-serif}
.stage{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
.weather{position:absolute;top:12px;right:14px;width:900px;height:138px;display:grid;grid-template-columns:150px 190px 160px 205px 195px;overflow:hidden;background:linear-gradient(180deg,#020d16 0%,#01060b 100%);border:1px solid rgba(0,207,255,.68);clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);box-shadow:inset 0 0 0 1px rgba(0,69,112,.7),0 0 24px rgba(0,150,255,.14)}
.weather:before,.weather:after{content:"";position:absolute;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,224,255,.7),transparent)}.weather:before{top:9px}.weather:after{bottom:9px}
.corner{position:absolute;width:23px;height:23px;z-index:5}.tl{left:4px;top:4px;border-left:3px solid var(--cyan);border-top:3px solid var(--cyan)}.tr{right:4px;top:4px;border-right:3px solid var(--cyan);border-top:3px solid var(--cyan)}.bl{left:4px;bottom:4px;border-left:3px solid #008fcb;border-bottom:3px solid #008fcb}.br{right:4px;bottom:4px;border-right:3px solid #008fcb;border-bottom:3px solid #008fcb}
.cell{position:relative;height:100%;min-width:0;border-right:1px solid rgba(0,175,240,.34)}.cell:last-child{border-right:0}.cell:after{content:"";position:absolute;right:9px;top:15px;width:7px;height:1px;background:#009bd5;box-shadow:0 9px 0 rgba(0,155,213,.78),0 18px 0 rgba(0,155,213,.54)}
.label{position:absolute;left:16px;top:14px;color:#0bd9ff;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1;text-shadow:0 0 7px rgba(0,207,255,.4)}.label:after{content:"";display:inline-block;width:22px;height:5px;margin-left:6px;border-top:1px solid rgba(0,214,255,.7);border-right:1px solid rgba(0,214,255,.55);vertical-align:middle}
.globe-cell{display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(0,140,255,.18),transparent 66%)}
.globe-frame{position:relative;width:128px;height:120px;display:flex;align-items:center;justify-content:center}.globe-frame:before,.globe-frame:after{content:"";position:absolute;left:2px;right:2px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,218,255,.75),transparent)}.globe-frame:before{top:8px}.globe-frame:after{bottom:8px}.gb{position:absolute;width:20px;height:20px;border-color:rgba(0,218,255,.9)}.gb1{left:3px;top:10px;border-left:2px solid;border-top:2px solid}.gb2{right:3px;top:10px;border-right:2px solid;border-top:2px solid}.gb3{left:3px;bottom:10px;border-left:2px solid;border-bottom:2px solid}.gb4{right:3px;bottom:10px;border-right:2px solid;border-bottom:2px solid}
.earth{width:116px;height:116px;overflow:visible;filter:drop-shadow(0 0 10px rgba(0,207,255,.88))}.world{animation:worldSpin 46s linear infinite}.grid{transform-origin:80px 80px;animation:gridSpin 70s linear infinite}.orbit1{transform-origin:80px 80px;animation:orbit 32s linear infinite}.orbit2{transform-origin:80px 80px;animation:orbit 54s linear reverse infinite}@keyframes worldSpin{from{transform:translateX(0)}to{transform:translateX(-160px)}}@keyframes gridSpin{to{transform:rotate(360deg)}}@keyframes orbit{to{transform:rotate(360deg)}}
.sunrow{position:absolute;left:16px;top:42px;display:flex;align-items:center;gap:16px}.sun{position:relative;width:39px;height:39px;border:2px solid var(--gold);border-radius:50%;filter:drop-shadow(0 0 6px rgba(245,210,10,.35))}.sun:before,.sun:after,.sun i:before,.sun i:after{content:"";position:absolute;left:50%;top:50%;width:56px;height:2px;transform:translate(-50%,-50%);background:linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 48px,var(--gold) 48px 56px)}.sun:after{transform:translate(-50%,-50%) rotate(90deg)}.sun i:before{transform:translate(-50%,-50%) rotate(45deg)}.sun i:after{transform:translate(-50%,-50%) rotate(-45deg)}.temp{font-size:36px;font-weight:300;line-height:1;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.2)}.condition{position:absolute;left:82px;top:86px;font-size:13px;font-weight:800;color:#e8f3f8;letter-spacing:.08em;white-space:nowrap}.micro{position:absolute;left:14px;bottom:12px;color:#65e8ff;font-size:13px;font-weight:900;letter-spacing:.02em;white-space:nowrap;text-shadow:0 0 10px rgba(0,207,255,.6)}
.timerow{position:absolute;left:18px;top:45px;display:flex;align-items:flex-end;gap:8px}.time{font-family:Consolas,"Courier New",monospace;font-size:38px;font-weight:300;line-height:1;color:#fff}.ampm{font-size:13px;font-weight:800;padding-bottom:5px;color:#fff}.zone{position:absolute;left:100px;top:92px;font-size:13px;font-weight:900;color:#e7f2f8;letter-spacing:.08em}
.dateval{position:absolute;left:16px;top:62px;color:var(--gold);font-size:15px;font-weight:900;letter-spacing:.035em;white-space:nowrap;text-shadow:0 0 8px rgba(245,210,10,.2)}.coords{position:absolute;left:14px;bottom:12px;color:#65e8ff;font-size:13px;font-weight:900;letter-spacing:.01em;white-space:nowrap;text-shadow:0 0 10px rgba(0,207,255,.58)}
.status{display:flex;flex-direction:column;align-items:center}.welcome{margin-top:18px;color:#78ebff;font-size:17px;font-weight:900;letter-spacing:.02em;text-shadow:0 0 10px rgba(0,207,255,.65)}.safe{margin-top:9px;width:142px;height:40px;border:1px solid rgba(0,244,125,.9);border-radius:7px;background:linear-gradient(180deg,rgba(0,77,42,.3),rgba(0,25,14,.24));display:flex;align-items:center;justify-content:center;gap:9px;color:#f2fff7;font-size:13px;font-weight:900;letter-spacing:.06em;box-shadow:inset 0 0 16px rgba(0,244,125,.1)}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green),0 0 0 4px rgba(0,244,125,.12)}.check{color:#00f186;font-size:14px}.normal{margin-top:9px;color:#78ebff;font-size:13px;font-weight:900;letter-spacing:.045em;white-space:nowrap;text-shadow:0 0 10px rgba(0,207,255,.65)}
@media(max-width:930px){.weather{transform:scale(calc((100vw - 28px)/900));transform-origin:top right;right:14px}}
</style>
</head>
<body>
<main class="stage">
<section class="weather" aria-label="Weather date and time instrument">
<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
<div class="cell globe-cell"><div class="globe-frame"><span class="gb gb1"></span><span class="gb gb2"></span><span class="gb gb3"></span><span class="gb gb4"></span>
<svg class="earth" viewBox="0 0 160 160"><defs><radialGradient id="o" cx="36%" cy="28%" r="74%"><stop offset="0" stop-color="#19ddff" stop-opacity=".84"/><stop offset=".2" stop-color="#087eb9" stop-opacity=".8"/><stop offset=".55" stop-color="#02416d" stop-opacity=".95"/><stop offset=".85" stop-color="#001326"/><stop offset="1" stop-color="#00050c"/></radialGradient><radialGradient id="s" cx="32%" cy="24%" r="68%"><stop offset="0" stop-color="#b9f8ff" stop-opacity=".6"/><stop offset=".28" stop-color="#0cc7ff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><pattern id="d" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="1.1" fill="#48e1ff"/><circle cx="4" cy="4" r=".6" fill="#0b90c8"/></pattern><pattern id="m" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".42" fill="#18cdf7" opacity=".72"/></pattern><clipPath id="c"><circle cx="80" cy="80" r="57"/></clipPath><filter id="g"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="80" cy="80" r="70" fill="none" stroke="#008ac6" stroke-width=".9" stroke-dasharray="2 5" opacity=".62"/><circle cx="80" cy="80" r="64" fill="none" stroke="#00b9ef" stroke-width="1" opacity=".5"/><g class="orbit1" fill="none" stroke="#00d1ff" stroke-width="1" opacity=".58"><ellipse cx="80" cy="80" rx="72" ry="41" transform="rotate(-28 80 80)"/><circle cx="18" cy="49" r="2" fill="#ff8217" stroke="none"/></g><g class="orbit2" fill="none" stroke="#007bb7" stroke-width=".9" opacity=".52"><ellipse cx="80" cy="80" rx="74" ry="54" transform="rotate(23 80 80)"/><circle cx="143" cy="55" r="1.8" fill="#ff9a20" stroke="none"/></g><circle cx="80" cy="80" r="57" fill="url(#o)" stroke="#18d5ff" stroke-width="1.4"/><circle cx="80" cy="80" r="57" fill="url(#s)"/><g clip-path="url(#c)"><g class="grid" fill="none" stroke="#1ccaf0" stroke-width=".65" opacity=".4"><ellipse cx="80" cy="80" rx="57" ry="16"/><ellipse cx="80" cy="80" rx="57" ry="31"/><ellipse cx="80" cy="80" rx="57" ry="45"/><ellipse cx="80" cy="80" rx="18" ry="57"/><ellipse cx="80" cy="80" rx="35" ry="57"/><ellipse cx="80" cy="80" rx="49" ry="57"/></g><g class="world" filter="url(#g)"><g transform="translate(0,0)"><path d="M31 35l13-7 16 2 7 8-4 8-8 1-2 8 7 8-4 8-11-5-5 8-7-4-4-14-8-6 3-10z" fill="url(#d)" stroke="#55e3ff" stroke-width=".8"/><path d="M54 74l10 2 8 9-1 13-7 11-2 18-8 13-6-6 1-15-6-12 3-13-4-11z" fill="url(#d)" stroke="#55e3ff" stroke-width=".8"/><path d="M93 36l15-8 22 4 10 8-2 8-14 5-5 9 14 7-4 8-12-2-8 8-4 12-8-1-8-12-12-5-7-11 6-9 11-5z" fill="url(#d)" stroke="#55e3ff" stroke-width=".8"/><path d="M104 87l10 2 6 8-3 16-8 19-7-4-2-15-7-9 4-13z" fill="url(#d)" stroke="#55e3ff" stroke-width=".8"/></g><g transform="translate(160,0)"><path d="M31 35l13-7 16 2 7 8-4 8-8 1-2 8 7 8-4 8-11-5-5 8-7-4-4-14-8-6 3-10z" fill="url(#d)" stroke="#55e3ff" stroke-width=".8"/><path d="M54 74l10 2 8 9-1 13-7 11-2 18-8 13-6-6 1-15-6-12 3-13-4-11z" fill="url(#d)" stroke="#55e3ff" stroke-width=".8"/><path d="M93 36l15-8 22 4 10 8-2 8-14 5-5 9 14 7-4 8-12-2-8 8-4 12-8-1-8-12-12-5-7-11 6-9 11-5z" fill="url(#d)" stroke="#55e3ff" stroke-width=".8"/><path d="M104 87l10 2 6 8-3 16-8 19-7-4-2-15-7-9 4-13z" fill="url(#d)" stroke="#55e3ff" stroke-width=".8"/></g></g><circle cx="80" cy="80" r="56" fill="url(#m)" opacity=".22"/></g><circle cx="80" cy="80" r="57" fill="none" stroke="#68ecff" stroke-width="1" opacity=".9"/><circle cx="51" cy="50" r="2" fill="#ff8c15"/><circle cx="111" cy="63" r="1.8" fill="#ff8c15"/><circle cx="74" cy="112" r="1.6" fill="#ff8c15"/></svg>
</div></div>
<div class="cell"><span class="label">Weather</span><div class="sunrow"><div class="sun"><i></i></div><div class="temp">72°F</div></div><div class="condition">CLEAR SKIES</div><div class="micro">HUMIDITY 38% | WIND 6 MPH NE</div></div>
<div class="cell"><span class="label">Time</span><div class="timerow"><span class="time" id="time">07:24</span><span class="ampm" id="ampm">AM</span></div><div class="zone">PDT</div></div>
<div class="cell"><span class="label">Date</span><div class="dateval" id="date">SUN, JULY 27, 2025</div><div class="coords">LAT 34.0322° N | LON 118.2437° W</div></div>
<div class="cell status"><div class="welcome">Welcome Back,</div><div class="safe"><span class="dot"></span><span>SITE SAFE</span><span class="check">✓</span></div><div class="normal">ALL SYSTEMS NORMAL</div></div>
</section>
</main>
<script>const time=document.getElementById('time'),ampm=document.getElementById('ampm'),date=document.getElementById('date');function update(){const d=new Date();let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;time.textContent=String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');ampm.textContent=ap;date.textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase()}update();setInterval(update,1000);</script>
</body>
</html>
