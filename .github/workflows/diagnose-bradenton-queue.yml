name: Diagnose Bradenton Scanner Queue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-bradenton-queue.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read queue configuration and scanner leases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const headers={authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'};
          async function cf(path,options={}){const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+path,{...options,headers:{...headers,...options.headers},signal:AbortSignal.timeout(30000)});const d=await r.json();if(!r.ok||!d.success)throw Error(`Cloudflare ${r.status}: ${JSON.stringify(d.errors||[])}`);return d.result;}
          const queues=await cf('/queues');
          const queue=queues.find(q=>q.queue_name==='mason-forge-department-work');
          if(!queue)throw Error('Production department queue is missing');
          const listed=queue.consumers?.find(c=>c.type==='worker');
          if(!listed)throw Error('Production queue has no worker consumer');
          const consumer=await cf(`/queues/${queue.queue_id}/consumers/${listed.consumer_id}`);
          console.log(JSON.stringify({queue:{queue_id:queue.queue_id,queue_name:queue.queue_name,settings:queue.settings,producers:queue.producers},consumer:{consumer_id:consumer.consumer_id,type:consumer.type,script_name:consumer.script_name,settings:consumer.settings,dead_letter_queue:consumer.dead_letter_queue}}));
          const db='/d1/database/736f655b-889d-4fb2-8948-0a396d39436f/query';
          async function query(sql){return (await cf(db,{method:'POST',body:JSON.stringify({sql})}))[0].results;}
          console.log(JSON.stringify({scannerStates:await query("SELECT status,COUNT(*) count,MIN(updated_at) oldest,MAX(updated_at) latest,SUM(attempts) attempts FROM holding_scan_items WHERE source_file_id=2514 GROUP BY status"),recentErrors:await query("SELECT id,status,attempts,error,updated_at FROM holding_scan_items WHERE source_file_id=2514 AND (attempts>0 OR error IS NOT NULL) ORDER BY updated_at DESC LIMIT 20")}));
          if(queue.settings?.delivery_paused)throw Error('Production department queue delivery is paused');
          if(consumer.type!=='worker'||consumer.script_name!=='mason-forge-cloud')throw Error('Production worker consumer is not attached to mason-forge-cloud');
          JS
