name: Deploy Mason Forge Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - ".github/workflows/deploy-mason-forge-cloud.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Mason Forge Worker
        run: npm run check

      - name: Cloudflare deployment dry run
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Mason Forge Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify full operational readiness
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://mason-forge-cloud.mason-forge-ssx.workers.dev/health';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let last;
          for (let attempt = 1; attempt <= 18; attempt += 1) {
            const response = await fetch(`${url}?attempt=${attempt}&t=${Date.now()}`, {
              cache: 'no-store',
              headers: { 'cache-control': 'no-cache, no-store, max-age=0', pragma: 'no-cache' },
            });
            const text = await response.text();
            try { last = JSON.parse(text); } catch { throw new Error(`Health returned non-JSON: ${text}`); }
            console.log(`Attempt ${attempt}:`, JSON.stringify(last));
            const noBlocked = Number(last.taskTotals?.BLOCKED || 0) === 0;
            const totalsReconcile = Number(last.totalTasks || 0) === Object.values(last.taskTotals || {})
              .reduce((sum, value) => sum + Number(value || 0), 0);
            if (response.ok && last.status === 'online' && last.operationalReady === true &&
                last.continuity?.verification_status === 'VERIFIED' && noBlocked && totalsReconcile &&
                Number(last.totalTasks || 0) > 0 && Number(last.outputCount || 0) > 0) {
              process.exit(0);
            }
            await sleep(10000);
          }
          throw new Error(`Mason Forge failed operational readiness: ${JSON.stringify(last)}`);
          NODE
