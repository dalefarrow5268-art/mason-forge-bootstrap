name: Mason Forge Bootstrap CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm --prefix cloud ci
      - name: Validate Worker and connector contract
        run: |
          npm --prefix cloud run check
          npm --prefix cloud run test:connector
          npm --prefix cloud run test:brain
      - name: Install dashboard dependencies
        run: npm --prefix frontend ci
      - name: Test dashboard data normalization
        run: npm --prefix frontend test
      - name: Build dashboard
        run: npm --prefix frontend run build
